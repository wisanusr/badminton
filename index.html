                                        </div>
                                        <div className="max-h-[45vh] overflow-y-auto no-scrollbar">
                                            {unlinkedUsers.map((u, i) => (
                                                <button key={u.User_ID} onClick={() => handleLinkProfile(u)} disabled={submitting}
                                                    className={`w-full text-left flex items-center justify-between px-4 py-3.5 active:bg-gray-100 ${i < unlinkedUsers.length - 1 ? 'border-b border-gray-200' : ''}`}>
                                                    <span className="text-[17px] text-black">{u.DisplayName}</span>
                                                    <IconChevronRight className="text-gray-300" size={20} />
                                                </button>
                                            ))}
                                            {unlinkedUsers.length === 0 && <div className="p-6 text-center text-gray-500 text-[15px]">ไม่พบชื่อนี้</div>}
                                        </div>
                                    </div>
                                    <p className="text-[13px] text-gray-500 px-4 mt-2">ประวัติการเล่นเดิมจะตามมาด้วย ถ้าเลือกผิดให้แจ้งแอดมิน</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ---------- หน้าแรก ----------
            const renderHome = () => {
                const emptyText = filterMyStatus === 'Joined' ? 'ยังไม่ได้ลงชื่อรอบไหน'
                    : filterMyStatus === 'NotJoined' ? 'ลงชื่อครบทุกรอบแล้ว'
                    : filterDay === 'Weekend' ? 'ยังไม่มีรอบวันหยุด'
                    : 'ยังไม่มีรอบตีที่เปิดอยู่';
                const tabs = [
                    { key: 'all', label: 'เร็ว ๆ นี้', Icon: IconClock, active: filterMyStatus === 'All' && filterDay === 'All', onClick: () => { setFilterMyStatus('All'); setFilterDay('All'); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
                    { key: 'joined', label: 'ลงแล้ว', Icon: IconCheckCircle, active: filterMyStatus === 'Joined', onClick: () => { setFilterMyStatus(p => p === 'Joined' ? 'All' : 'Joined'); setFilterDay('All'); } },
                    { key: 'notjoined', label: 'ยังไม่ลง', Icon: IconCircle, active: filterMyStatus === 'NotJoined', onClick: () => { setFilterMyStatus(p => p === 'NotJoined' ? 'All' : 'NotJoined'); setFilterDay('All'); } },
                    { key: 'weekend', label: 'วันหยุด', Icon: IconSun, active: filterDay === 'Weekend', onClick: () => { setFilterDay(p => p === 'Weekend' ? 'All' : 'Weekend'); setFilterMyStatus('All'); } },
                    { key: 'point', label: 'ทวงแต้ม', Icon: IconBanknote, active: false, onClick: () => window.open(POINT_URL, '_blank') }
                ];

                return (
                    <>
                        <main className="max-w-md mx-auto w-full px-4 pb-32 animate-in" style={{ paddingTop: 'calc(env(safe-area-inset-top, 0px) + 2.5rem)' }}>
                            <h1 className="text-[34px] font-bold text-black mb-5 px-1 tracking-tight">{APP_NAME}</h1>

                            <button onClick={handleLogout} className="w-full bg-white rounded-[20px] mb-8 p-4 flex items-center gap-4 shadow-sm active:bg-gray-50 text-left">
                                {lineProfile && lineProfile.picture
                                    ? <img src={lineProfile.picture} alt="" className="w-[56px] h-[56px] rounded-full" />
                                    : <div className="w-[56px] h-[56px] bg-gray-100 rounded-full flex items-center justify-center text-3xl">🏸</div>}
                                <div className="flex-1 min-w-0">
                                    <div className="font-medium text-[20px] text-black truncate">{currentUser.DisplayName}</div>
                                    <div className="text-[13px] text-gray-500">{isAdminUser ? 'แอดมิน' : 'สมาชิก'} • แตะเพื่อออกจากระบบ</div>
                                </div>
                            </button>

                            <SectionTitle right={isAdminUser && (
                                <button onClick={handleSharePublic} className="text-[#007AFF] text-[15px] font-medium active:opacity-70">Share Link</button>
                            )}>รอบที่กำลังจะมา</SectionTitle>

                            <div className="flex flex-col gap-3 mb-8">
                                {loading && sessionInfos.length === 0 ? (
                                    <><SessionSkeleton /><SessionSkeleton /><SessionSkeleton /></>
                                ) : homeList.upcoming.length === 0 ? (
                                    <div className="bg-white rounded-[20px] p-10 text-center shadow-sm">
                                        <div className="text-4xl mb-2">📭</div>
                                        <div className="text-gray-500 text-[15px]">{emptyText}</div>
                                    </div>
                                ) : homeList.upcoming.map(({ s, info: si }) => (
                                    <SessionCard key={s.Session_ID} s={s} info={si} rules={rules} myId={myId}
                                        getUserName={getUserName} showTasks={isAdminUser} onOpen={() => openSession(s.Session_ID)} />
                                ))}
                            </div>

                            {homeList.past.length > 0 && (
                                <>
                                    <SectionTitle>รอสรุปยอด</SectionTitle>
                                    <div className="flex flex-col gap-3">
                                        {homeList.past.map(({ s, info: si }) => (
                                            <SessionCard key={s.Session_ID} s={s} info={si} rules={rules} myId={myId}
                                                getUserName={getUserName} showTasks={isAdminUser} onOpen={() => openSession(s.Session_ID)} />
                                        ))}
                                    </div>
                                </>
                            )}
                        </main>

                        <div className="fixed bottom-0 left-0 w-full bg-white/85 backdrop-blur-xl border-t border-gray-200 z-50 pb-safe">
                            <div className="max-w-md mx-auto flex px-2">
                                {tabs.map(({ key, label, Icon, active, onClick }) => (
                                    <button key={key} onClick={onClick}
                                        className={`flex flex-col items-center gap-1 flex-1 py-2 transition-colors ${active ? 'text-[#007AFF]' : 'text-gray-400'}`}>
                                        <Icon size={24} />
                                        <span className="text-[10px] font-medium">{label}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </>
                );
            };

            // ---------- หน้ารายละเอียดรอบ ----------
            const renderDetail = () => {
                const s = selectedSession;
                const si = info;
                const dim = si.isPast || si.isCancelled;
                const extraCost = extraShuttles * rules.SHUTTLECOCK_PRICE;
                const extraPerHead = currentRegs.length > 0 && extraShuttles > 0 ? Math.ceil(extraCost / currentRegs.length) : 0;
                const collected = si.costs.perHead * currentRegs.length;
                const diff = collected - si.costs.total;
                const extraChanged = extraShuttles !== (Number(s.Extra_Shuttles) || 0);

                const rulesText = si.isWorkday
                    ? `ชั่วโมงละไม่เกิน ${si.cap} คน ลงชื่อ เปลี่ยนเวลา หรือยกเลิกได้จนถึงวันเล่น`
                    : `ไม่จำกัดจำนวน แต่ต้องมีอย่างน้อย ${si.min} คน ลงชื่อได้ถึง${TH_DAYS[si.lastRegDay.getDay()]}ที่ ${si.lastRegDay.getDate()} ${TH_MONTHS_SHORT[si.lastRegDay.getMonth()]} ถ้าไม่ครบระบบจะงดรอบและแจ้งทาง LINE`;

                const closedReason = si.isPast ? 'รอบนี้จบแล้ว'
                    : !si.isOpen ? 'รอบนี้ปิดรับลงชื่อ'
                    : (!si.isWorkday && si.weekendClosed) ? `ปิดรับลงชื่อแล้ว (ปิดก่อนวันเล่น ${rules.WEEKEND_CLOSE_DAYS} วัน)`
                    : 'เต็มทั้ง 2 ชั่วโมงแล้ว';

                const hourOptions = [
                    { value: 'All', label: 'ทั้ง 2 ชั่วโมง (18:00-20:00)', disabled: disableAll, note: disableAll ? 'มีชั่วโมงที่เต็ม' : '' },
                    { value: H1, label: '18:00 - 19:00', disabled: disableH1, note: `${h1Others}/${cap}` },
                    { value: H2, label: '19:00 - 20:00', disabled: disableH2, note: `${h2Others}/${cap}` }
                ];

                const oneHourPlayers = si.isWorkday && currentRegs.some(r => hoursOf(r) !== 'All');
                const PlayerBox = ({ title, list, target }) => (
                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden">
                        <div className="px-4 py-3 bg-gray-50/60 border-b border-gray-100 flex justify-between items-center">
                            <span className="text-[16px] font-semibold text-gray-700">{title}</span>
                            <span className="text-[15px] text-gray-500 tabular-nums">{target ? `${list.length}/${target}` : `${list.length} คน`}</span>
                        </div>
                        <div className="p-4 flex flex-wrap gap-2">
                            {list.length === 0 && <span className="text-gray-400 text-[14px]">ยังไม่มี</span>}
                            {list.map((p, i) => <NameChip key={i} size="lg" name={getUserName(p.User_ID)} isMe={String(p.User_ID) === myId} />)}
                        </div>
                    </div>
                );

                return (
                    <div className="w-full max-w-md mx-auto pb-24 animate-in">
                        {/* Nav */}
                        <div style={{ paddingTop: 'calc(env(safe-area-inset-top, 0px) + 0.75rem)' }} className={`sticky top-0 z-50 flex items-center justify-between px-4 pb-3 mb-2 transition-all duration-300 ${isScrolled ? 'bg-white/95 backdrop-blur-md border-b border-gray-200/50 shadow-sm' : ''}`}>
                            <button onClick={closeSession} className="w-8 h-8 rounded-full bg-gray-200/80 flex items-center justify-center text-black active:opacity-70 relative z-10">
                                <IconChevronLeft size={22} className="-ml-0.5" />
                            </button>
                            <div className={`absolute left-1/2 -translate-x-1/2 font-semibold text-[17px] text-black transition-opacity ${isScrolled ? 'opacity-100' : 'opacity-0'}`}>
                                {fmtShort(si.date)}
                            </div>
                            {isAdminUser
                                ? <button onClick={openAdminManager} className="px-4 h-8 rounded-full bg-gray-200/80 text-[15px] font-medium text-black active:opacity-70 relative z-10">Manage</button>
                                : <div className="w-8 h-8" />}
                        </div>

                        <div className="px-4">
                            {/* Info */}
                            <div className={`bg-white rounded-[20px] shadow-sm p-5 mb-8 ${dim ? 'opacity-80' : ''}`}>
                                <DateTile date={si.date} dim={dim} size="lg" />
                                <h1 className="text-[28px] font-bold text-black mt-4 mb-2 tracking-tight leading-tight">
                                    {fmtLong(si.date)}{si.isCancelled && ' (งด)'}
                                </h1>
                                <p className={`font-semibold text-[17px] mb-2 ${si.isCancelled ? 'text-gray-400 line-through' : 'text-black'}`}>
                                    {timeRange(si.isWorkday)} • {s.Location}
                                </p>
                                <p className="text-[15px] text-gray-500 leading-relaxed">{rulesText}</p>
                            </div>

                            {/* Registration */}
                            <SectionTitle>ลงชื่อ</SectionTitle>
                            <div className="bg-white rounded-[20px] shadow-sm overflow-hidden mb-8">
                                {si.isCancelled ? (
                                    <div className="p-5 text-center text-[15px] text-gray-500">รอบนี้งดเล่น</div>
                                ) : myReg && !isEditing ? (
                                    <>
                                        <Row label="สถานะ" value={<span className={si.isPast ? 'text-gray-500' : 'text-[#34C759]'}>ลงชื่อแล้ว</span>} />
                                        <Row label="เวลาเล่น" value={hoursLabel(hoursOf(myReg), si.isWorkday)} last={si.isPast} />
                                        {si.isPast ? null : (
                                            <>
                                                {si.isWorkday && si.isOpen && (
                                                    <button onClick={() => setIsEditing(true)} disabled={submitting}
                                                        className="w-full p-4 text-center text-[#007AFF] text-[17px] active:bg-gray-50 border-b border-gray-200">
                                                        เปลี่ยนเวลา
                                                    </button>
                                                )}
                                                <button onClick={() => setShowCancelConfirm(true)} disabled={submitting}
                                                    className="w-full p-4 text-center text-[#FF3B30] text-[17px] active:bg-gray-50">
                                                    ไม่สะดวกเล่นแล้ว
                                                </button>
                                            </>
                                        )}
                                    </>
                                ) : (!myReg && !si.canRegister) ? (
                                    <div className="p-6 text-center">
                                        <IconClock size={30} className="text-gray-300 mx-auto mb-2" />
                                        <div className="text-[17px] font-medium text-black">{closedReason}</div>
                                    </div>
                                ) : (
                                    <>
                                        {si.isWorkday ? (
                                            <button type="button" disabled={submitting} onClick={() => setIsTimeSelectorOpen(true)}
                                                className="w-full p-4 flex justify-between items-center active:bg-gray-50 border-b border-gray-200">
                                                <span className="text-[17px] text-black">เวลา</span>
                                                <span className="flex items-center gap-1.5 text-[17px] text-gray-500">
                                                    {hoursLabel(selectedHour, true)}
                                                    <IconChevronRight className="text-gray-300" size={20} />
                                                </span>
                                            </button>
                                        ) : (
                                            <Row label="เวลา" value="16:00-18:00" />
                                        )}
                                        <Row label="ค่าใช้จ่าย" value={`คนละ ${si.costs.perHead} ฿`} />
                                        {isEditing && (
                                            <button type="button" disabled={submitting} onClick={() => setIsEditing(false)}
                                                className="w-full p-4 text-center text-gray-500 text-[17px] active:bg-gray-50 border-b border-gray-200">
                                                ไม่เปลี่ยน
                                            </button>
                                        )}
                                        <button type="button" onClick={handleRegister} disabled={submitting}
                                            className="w-full p-4 text-center font-semibold text-[#007AFF] text-[17px] active:bg-gray-50 disabled:opacity-50">
                                            {submitting ? 'กำลังบันทึก...' : isEditing ? 'บันทึกเวลาใหม่' : 'ลงชื่อ'}
                                        </button>
                                    </>
                                )}
                            </div>

                            {/* Players */}
                            <SectionTitle right={`รวม ${currentRegs.length} คน`}>รายชื่อ</SectionTitle>
                            <div className="flex flex-col gap-3 mb-8">
                                {si.isWorkday ? (
                                    oneHourPlayers ? (
                                        <>
                                            <PlayerBox title="18:00 - 19:00" list={currentRegs.filter(inH1)} target={si.cap} />
                                            <PlayerBox title="19:00 - 20:00" list={currentRegs.filter(inH2)} target={si.cap} />
                                        </>
                                    ) : (
                                        <PlayerBox title="เล่น 2 ชั่วโมง" list={currentRegs} target={si.cap} />
                                    )
                                ) : (
                                    <PlayerBox title="16:00 - 18:00" list={currentRegs} target={null} />
                                )}
                            </div>

                            {/* Cost */}
                            {!si.isCancelled && (
                                <>
                                    <SectionTitle>ค่าใช้จ่าย</SectionTitle>
                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden mb-8">
                                        <Row label="ค่าคอร์ด" value={`${si.costs.court} ฿`} />
                                        <Row label={`ลูกแบด ${rules.SHUTTLES_PER_SESSION} ลูก`} value={`${si.costs.shuttle} ฿`} />
                                        <div className="p-4 flex justify-between items-center border-b border-gray-200">
                                            <div>
                                                <div className="text-[17px] font-semibold text-black">คนละ</div>
                                                <div className="text-[13px] text-gray-500">
                                                    {si.costs.splitBy < rules.COST_SPLIT_BASE
                                                        ? `หาร ${si.costs.splitBy} คนตอนนี้ • ครบ ${rules.COST_SPLIT_BASE} คนเหลือ ${si.costs.fullPerHead} ฿`
                                                        : `หาร ${rules.COST_SPLIT_BASE} คน มากกว่านี้จ่ายเท่าเดิม`}
                                                </div>
                                            </div>
                                            <span className="text-[22px] font-bold text-[#34C759] tabular-nums">{si.costs.perHead} ฿</span>
                                        </div>

                                        <div className={`p-4 flex justify-between items-center ${extraShuttles > 0 ? 'border-b border-gray-200' : ''}`}>
                                            <div>
                                                <div className="text-[17px] text-black">ใช้ลูกเพิ่มหลังเล่น</div>
                                                {extraShuttles > 0 && <div className="text-[13px] text-gray-500">+{extraCost} ฿ หารทุกคนที่มา</div>}
                                            </div>
                                            {isAdminUser ? (
                                                <div className="flex items-center gap-3 bg-[#E9E9EA] rounded-[10px] p-1">
                                                    <button onClick={() => setExtraShuttles(Math.max(0, extraShuttles - 1))} className="w-8 h-8 rounded-[8px] bg-white shadow-sm text-lg active:opacity-70">-</button>
                                                    <span className="font-semibold text-[17px] w-5 text-center tabular-nums">{extraShuttles}</span>
                                                    <button onClick={() => setExtraShuttles(Math.min(20, extraShuttles + 1))} className="w-8 h-8 rounded-[8px] bg-white shadow-sm text-lg active:opacity-70">+</button>
                                                </div>
                                            ) : (
                                                <span className="text-[17px] text-gray-500">{extraShuttles} ลูก</span>
                                            )}
                                        </div>
                                        {extraShuttles > 0 && (
                                            <div className="p-4 flex justify-between items-center">
                                                <span className="text-[17px] text-black">เก็บเพิ่มคนละ</span>
                                                <span className="text-[17px] font-semibold text-[#FF9500] tabular-nums">{extraPerHead} ฿</span>
                                            </div>
                                        )}
                                        {isAdminUser && currentRegs.length > 0 && (
                                            <div className="px-4 py-3 bg-gray-50 border-t border-gray-200 flex justify-between text-[14px]">
                                                <span className="text-gray-500">เก็บได้ {currentRegs.length} × {si.costs.perHead}</span>
                                                <span className={diff >= 0 ? 'text-emerald-600 font-medium' : 'text-rose-600 font-medium'}>
                                                    {collected} ฿ ({diff >= 0 ? 'เกิน' : 'ขาด'} {Math.abs(diff)} ฿)
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                    {isAdminUser && extraChanged && (
                                        <div className="-mt-6 mb-8 flex gap-2">
                                            <button onClick={() => setExtraShuttles(Number(s.Extra_Shuttles) || 0)} className="flex-1 bg-white text-[#FF3B30] font-semibold py-3 rounded-[14px] shadow-sm active:opacity-70">ยกเลิก</button>
                                            <button onClick={handleSaveExtraShuttles} disabled={submitting} className="flex-[2] bg-[#007AFF] text-white font-semibold py-3 rounded-[14px] active:opacity-80 disabled:opacity-50">บันทึกจำนวนลูก</button>
                                        </div>
                                    )}
                                </>
                            )}

                            {/* Admin checklist */}
                            {isAdminUser && !si.isCancelled && (
                                <div className="mb-8">
                                    <SectionTitle>เช็คลิสต์แอดมิน</SectionTitle>
                                    <div className="bg-white rounded-[20px] overflow-hidden shadow-sm">
                                        {TASKS.map((task, i) => {
                                            const checked = pendingTasks[task.key] !== undefined ? pendingTasks[task.key] : isTrue(s[task.key]);
                                            return (
                                                <div key={task.key} onClick={() => !submitting && handleTaskToggleLocal(task.key)}
                                                    className={`p-4 flex justify-between items-center active:bg-gray-50 cursor-pointer ${i < TASKS.length - 1 ? 'border-b border-gray-200' : ''}`}>
                                                    <span className={`text-[17px] ${checked ? 'text-gray-400 line-through' : 'text-black'}`}>{task.label}</span>
                                                    <span role="switch" aria-checked={checked}
                                                        className={`${checked ? 'bg-[#34C759]' : 'bg-[#E9E9EA]'} relative inline-flex h-[31px] w-[51px] shrink-0 rounded-full transition-colors duration-300`}>
                                                        <span className={`${checked ? 'translate-x-[22px]' : 'translate-x-[2px]'} inline-block h-[27px] w-[27px] mt-[2px] rounded-full bg-white shadow transition duration-300`} />
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    {Object.keys(pendingTasks).length > 0 && (
                                        <div className="mt-3 flex gap-2">
                                            <button onClick={() => setPendingTasks({})} className="flex-1 bg-white text-[#FF3B30] font-semibold py-3 rounded-[14px] shadow-sm active:opacity-70">ยกเลิก</button>
                                            <button onClick={handleTaskSave} disabled={submitting} className="flex-[2] bg-[#007AFF] text-white font-semibold py-3 rounded-[14px] active:opacity-80 disabled:opacity-50">บันทึกเช็คลิสต์</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* LINE text */}
                            {isAdminUser && (
                                <div className="mb-8">
                                    <SectionTitle right={
                                        <button onClick={handleCopyLineText} className={`text-[15px] font-medium ${copied ? 'text-[#34C759]' : 'text-[#007AFF] active:opacity-70'}`}>
                                            {copied ? 'คัดลอกแล้ว' : 'คัดลอก'}
                                        </button>
                                    }>ข้อความโพสต์ LINE</SectionTitle>
                                    <div className="bg-white rounded-[20px] overflow-hidden shadow-sm">
                                        <textarea id="line-export-text" rows="16" value={lineText} onChange={e => setLineText(e.target.value)}
                                            className="w-full p-4 text-[15px] text-black bg-transparent outline-none resize-y" />
                                    </div>
                                    <p className="text-[13px] text-gray-500 px-4 mt-2">แก้ข้อความก่อนคัดลอกได้</p>
                                </div>
                            )}
                        </div>

                        {/* Time picker */}
                        {isTimeSelectorOpen && ReactDOM.createPortal(
                            <div className="fixed inset-0 z-[200] flex flex-col justify-end">
                                <div className="absolute inset-0 bg-black/40" onClick={() => setIsTimeSelectorOpen(false)} />
                                <div className="relative w-full max-w-md mx-auto p-2 pb-safe sheet-in">
                                    <div className="bg-white rounded-[14px] overflow-hidden mb-2">
                                        <div className="p-3 text-center text-[13px] text-gray-500 font-medium border-b border-gray-200">เลือกเวลา (ชั่วโมงละไม่เกิน {cap} คน)</div>
                                        {hourOptions.map((o, i) => (
                                            <button key={o.value} type="button" disabled={o.disabled}
                                                onClick={() => { setSelectedHour(o.value); setIsTimeSelectorOpen(false); }}
                                                className={`w-full p-4 text-center text-[19px] active:bg-gray-100 ${i < hourOptions.length - 1 ? 'border-b border-gray-200' : ''} ${o.disabled ? 'text-gray-300' : 'text-[#007AFF]'}`}>
                                                {o.label}
                                                {o.note && <span className="text-[14px] ml-2 text-gray-400">{o.disabled && o.value !== 'All' ? 'เต็ม' : o.note}</span>}
                                            </button>
                                        ))}
                                    </div>
                                    <button type="button" onClick={() => setIsTimeSelectorOpen(false)} className="w-full p-4 bg-white rounded-[14px] text-center text-[19px] font-semibold text-[#007AFF] active:bg-gray-100">
                                        ปิด
                                    </button>
                                </div>
                            </div>,
                            document.body
                        )}

                        {/* Admin manager */}
                        {showAdminManager && (
                            <div className="fixed inset-0 z-[100] flex flex-col bg-[#F2F2F7] sheet-in">
                                <div className="flex items-center justify-between px-4 py-3 bg-white/85 backdrop-blur-md border-b border-gray-200 pt-safe">
                                    <button onClick={() => setShowAdminManager(false)} className="text-[17px] text-[#007AFF]">ยกเลิก</button>
                                    <h3 className="text-[17px] font-semibold text-black">จัดการรายชื่อ</h3>
                                    <button onClick={handleAdminSave} disabled={submitting} className="text-[17px] text-[#007AFF] font-semibold disabled:opacity-50">บันทึก</button>
                                </div>

                                <div className="flex-1 overflow-y-auto pb-10">
                                    <div className="mt-6">
                                        <SectionTitle>รายชื่อ ({amData.length})</SectionTitle>
                                        <div className="bg-white border-y border-gray-200 divide-y divide-gray-200">
                                            {amData.length === 0 ? (
                                                <div className="p-4 text-center text-[17px] text-gray-500">ยังไม่มีผู้เล่น</div>
                                            ) : amData.map((reg, idx) => (
                                                <div key={idx} className="p-4 flex items-center gap-3">
                                                    <span className="flex-1 text-[17px] font-medium text-black truncate">{nameById[String(reg.User_ID)] || reg.DisplayName}</span>
                                                    {si.isWorkday && (
                                                        <select value={hoursOf(reg)}
                                                            onChange={e => setAmData(amData.map((r, i) => i === idx ? { ...r, Hours_Joined: e.target.value } : r))}
                                                            className="bg-gray-100 rounded-[8px] px-2 py-1.5 text-[14px] font-medium outline-none">
                                                            <option value="All">2 ชม.</option>
                                                            <option value={H1}>{H1}</option>
                                                            <option value={H2}>{H2}</option>
                                                        </select>
                                                    )}
                                                    <button onClick={() => setAmData(amData.filter((_, i) => i !== idx))}
                                                        className="w-8 h-8 rounded-full bg-[#FF3B30]/10 flex items-center justify-center text-[#FF3B30] active:bg-[#FF3B30]/20">
                                                        <IconTrash size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-8">
                                        <SectionTitle>เพิ่มผู้เล่น</SectionTitle>
                                        <div className="bg-white border-y border-gray-200 divide-y divide-gray-200">
                                            <div className="p-3 pl-4 flex items-center">
                                                <span className="text-[17px] text-black w-24">จากระบบ</span>
                                                <select value={amExistingId} onChange={e => { setAmExistingId(e.target.value); setAmNewName(""); }}
                                                    className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right">
                                                    <option value="">เลือก</option>
                                                    {[...users].sort((a, b) => String(a.DisplayName).localeCompare(String(b.DisplayName), 'th'))
                                                        .map(u => <option key={u.User_ID} value={String(u.User_ID)}>{u.DisplayName}</option>)}
                                                </select>
                                            </div>
                                            <div className="p-3 pl-4 flex items-center">
                                                <span className="text-[17px] text-black w-24">ชื่อใหม่</span>
                                                <input type="text" placeholder="พิมพ์ชื่อ" value={amNewName}
                                                    onChange={e => { setAmNewName(e.target.value); setAmExistingId(""); }}
                                                    className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right placeholder-gray-300" />
                                            </div>
                                            {si.isWorkday && (
                                                <div className="p-3 pl-4 flex items-center">
                                                    <span className="text-[17px] text-black w-24">ชั่วโมง</span>
                                                    <select value={amNewHours} onChange={e => setAmNewHours(e.target.value)}
                                                        className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right">
                                                        <option value="All">2 ชั่วโมง</option>
                                                        <option value={H1}>{H1}</option>
                                                        <option value={H2}>{H2}</option>
                                                    </select>
                                                </div>
                                            )}
                                            <button onClick={handleAdminAdd} className="w-full p-3 text-[#007AFF] font-medium text-[17px] active:bg-gray-50">เพิ่มลงรายชื่อ</button>
                                        </div>
                                        <p className="text-[13px] text-gray-500 px-4 mt-2">แอดมินเพิ่มได้เกินโควตา ระบบไม่บล็อก</p>
                                    </div>

                                    <div className="mt-8">
                                        <SectionTitle>ตั้งค่ารอบ</SectionTitle>
                                        <div className="bg-white border-y border-gray-200">
                                            <label className="p-3 px-4 flex items-center justify-between cursor-pointer">
                                                <span className="text-[17px] text-[#FF3B30]">งดรอบนี้</span>
                                                <input type="checkbox" checked={amWillCancel} onChange={e => setAmWillCancel(e.target.checked)} className="sr-only peer" />
                                                <span className="w-[51px] h-[31px] bg-[#E9E9EA] rounded-full relative transition-colors peer-checked:bg-[#FF3B30] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[27px] after:w-[27px] after:shadow after:transition-all peer-checked:after:translate-x-[20px]" />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Cancel confirm */}
                        {showCancelConfirm && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
                                <div className="bg-white px-6 py-6 rounded-[24px] shadow-xl flex flex-col items-center gap-3 w-[85%] max-w-sm text-center animate-in">
                                    <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center text-red-500"><IconShield size={24} /></div>
                                    <h3 className="text-xl font-bold text-black">ไม่สะดวกเล่นแล้วใช่ไหม?</h3>
                                    <p className="text-[15px] text-gray-500">ระบบจะแจ้งแอดมินทาง LINE และเปิดที่ว่างให้คนอื่น</p>
                                    <div className="flex w-full gap-3 mt-3">
                                        <button onClick={() => setShowCancelConfirm(false)} disabled={submitting} className="flex-1 py-3.5 rounded-[14px] bg-gray-100 text-gray-600 font-semibold text-[17px] active:bg-gray-200">ปิด</button>
                                        <button onClick={handleCancel} disabled={submitting} className="flex-1 py-3.5 rounded-[14px] bg-[#FF3B30] text-white font-semibold text-[17px] active:opacity-80 flex justify-center items-center">
                                            {submitting ? <IconLoader size={18} className="text-white" /> : 'ยืนยันยกเลิก'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative">
                    <Toast message={toast.message} type={toast.type} />
                    {submitting && <GlobalLoader />}
                    {selected ? renderDetail() : renderHome()}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<BadmintonApp />);
    </script>
</body>
</html>
