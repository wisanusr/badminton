        // ===================== App =====================
        function BadmintonApp() {
            // ---- data ----
            const [users, setUsers] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [allRegistrations, setAllRegistrations] = useState([]);
            const [appSettings, setAppSettings] = useState({});
            const [serverRules, setServerRules] = useState(null);   // กติกาที่ server ตรวจช่วงแล้ว
            const [ruleLimits, setRuleLimits] = useState({});       // ช่วงค่าที่ยอมรับของแต่ละคีย์ (ใช้กับช่องกรอก)

            // ---- auth ----
            const [currentUser, setCurrentUser] = useState(null);
            const [lineProfile, setLineProfile] = useState(null);
            const [isAdminUser, setIsAdminUser] = useState(false);
            const [authLoading, setAuthLoading] = useState(true);
            const [publicViewMode, setPublicViewMode] = useState(false);

            // ---- ui ----
            const [loading, setLoading] = useState(true);
            const [globalError, setGlobalError] = useState(null);
            const [submitting, setSubmitting] = useState(false);
            const [toast, setToast] = useState({ message: '', type: '' });
            const [newUserName, setNewUserName] = useState("");
            const [searchUserQuery, setSearchUserQuery] = useState("");
            const [filterMyStatus, setFilterMyStatus] = useState("All");
            const [filterDay, setFilterDay] = useState("All");

            // ---- detail ----
            const [selectedId, setSelectedId] = useState(null);
            const [isScrolled, setIsScrolled] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [showCancelConfirm, setShowCancelConfirm] = useState(false);
            const [selectedHour, setSelectedHour] = useState("All");
            const [extraShuttles, setExtraShuttles] = useState(0);
            const [pendingTasks, setPendingTasks] = useState({});
            const [lineText, setLineText] = useState("");
            const [copied, setCopied] = useState(false);

            // ---- admin manager ----
            const [showAdminPage, setShowAdminPage] = useState(false);
            const [showAdminManager, setShowAdminManager] = useState(false);
            const [amData, setAmData] = useState([]);
            const [amBase, setAmBase] = useState([]);   // snapshot ตอนเปิดหน้าแก้ไข
            const [amExistingId, setAmExistingId] = useState("");
            const [amNewName, setAmNewName] = useState("");
            const [amNewHours, setAmNewHours] = useState("All");
            const [amWillCancel, setAmWillCancel] = useState(false);

            const scrollPositionRef = useRef(0);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast({ message: '', type: '' }), 3000);
            };

            // ---------- API ----------
            // ID token ของ LINE มีอายุ ~1 ชม. ถ้าหมดอายุไม่รีโหลดกลางงานเอง ให้ผู้ใช้เลือกว่าจะเข้าสู่ระบบใหม่ตอนไหน
            const askRelogin = (auto) => {
                if (auto || window.confirm('เซสชัน LINE หมดอายุ ต้องเข้าสู่ระบบใหม่\n(สิ่งที่ยังไม่ได้บันทึกจะหาย) เข้าสู่ระบบตอนนี้เลยไหม?')) {
                    liff.logout();
                    liff.login({ redirectUri: window.location.href });
                }
                const err = new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
                err.isAuth = true;
                return err;
            };

            const sendApiRequest = async (action, payload = null) => {
                const isRead = action === 'me' || action === 'getAllData';
                if (!isRead && liffReady) {
                    const decoded = liff.getDecodedIDToken && liff.getDecodedIDToken();
                    if (decoded && decoded.exp && decoded.exp - Math.floor(Date.now() / 1000) < 30) throw askRelogin();
                }
                const idToken = liffReady && liff.isLoggedIn() ? liff.getIDToken() : null;
                // action อ่านอย่างเดียว retry ได้ปลอดภัย (Apps Script cold start มักช้า/พลาดครั้งแรก)
                const maxTries = (action === 'me' || action === 'getAllData') ? 2 : 1;
                for (let attempt = 1; ; attempt++) {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 25000);
                    try {
                        // ไม่ใส่ headers เพื่อให้เป็น text/plain และไม่ติด CORS preflight
                        const res = await fetch(GAS_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action, payload, idToken }),
                            signal: controller.signal
                        });
                        const result = await res.json();
                        if (result.code === 'AUTH_EXPIRED') throw askRelogin(action === 'me'); // ตอนเปิดแอป (me) เข้าสู่ระบบใหม่เองทันที
                        return result;
                    } catch (e) {
                        if (e.isAuth) throw e;
                        if (attempt < maxTries) continue;
                        if (e.name === 'AbortError') throw new Error("การเชื่อมต่อใช้เวลานานเกินไป กรุณาลองใหม่");
                        throw e;
                    } finally {
                        clearTimeout(timer);
                    }
                }
            };

            const fetchAllData = async () => {
                try {
                    const result = await sendApiRequest("getAllData");
                    if (result.status === "success") {
                        setSessions(result.data.sessions || []);
                        setUsers(result.data.users || []);
                        setAllRegistrations(result.data.registrations || []);
                        setAppSettings(result.data.settings || {});
                        setServerRules(result.data.rules || null);
                        setRuleLimits(result.data.limits || {});
                    } else {
                        setGlobalError("โหลดข้อมูลไม่ได้: " + result.message);
                    }
                } catch (e) {
                    setGlobalError("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            // เรียก action ที่เขียนข้อมูล แล้วโหลดข้อมูลใหม่
            const runAction = async (action, payload, okMessage) => {
                setSubmitting(true);
                try {
                    const r = await sendApiRequest(action, payload);
                    if (r.status === 'success') {
                        if (okMessage) showToast(okMessage);
                        await fetchAllData();
                        return true;
                    }
                    showToast(r.message || 'ทำรายการไม่สำเร็จ', 'error');
                    await fetchAllData();
                    return false;
                } catch (e) {
                    showToast('เชื่อมต่อไม่ได้: ' + e.message, 'error');
                    return false;
                } finally {
                    setSubmitting(false);
                }
            };

            const applyUser = (u) => {
                setCurrentUser(u);
                setIsAdminUser(!!u.isAdmin);
            };

            // ---------- LIFF login ----------
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('public') === 'true') {
                    setPublicViewMode(true);
                    setAuthLoading(false);
                    fetchAllData();
                    return;
                }
                (async () => {
                    try {
                        await Promise.race([
                            liff.init({ liffId: LIFF_ID }),
                            new Promise((_, rej) => setTimeout(() => rej(new Error("LINE ตอบสนองช้า (liff.init timeout)")), 15000))
                        ]);
                        if (!liff.isLoggedIn()) {
                            liff.login({ redirectUri: window.location.href });
                            return;
                        }
                        liffReady = true;
                        // โหลดรายการแบบ background (หน้าจอมี skeleton) รอแค่ "me" ก่อนเข้าแอป
                        fetchAllData();
                        const me = await sendApiRequest("me");
                        if (me.status === "success") {
                            setLineProfile(me.data.line);
                            if (me.data.user) applyUser(me.data.user);
                        } else {
                            setGlobalError(me.message);
                        }
                    } catch (e) {
                        setGlobalError("เข้าสู่ระบบ LINE ไม่สำเร็จ: " + e.message);
                    } finally {
                        setAuthLoading(false);
                    }
                })();
            }, []);

            // ---------- derived ----------
            const rules = useMemo(() => readRules(serverRules, appSettings), [serverRules, appSettings]);
            const myId = currentUser ? String(currentUser.User_ID) : '';

            const nameById = useMemo(() => {
                const m = {};
                users.forEach(u => { m[String(u.User_ID)] = u.DisplayName; });
                return m;
            }, [users]);
            const getUserName = (id) => nameById[String(id)] || 'ไม่ทราบชื่อ';
            const getUserPicture = (id) => {
                if (String(id) === myId && lineProfile && lineProfile.picture) return lineProfile.picture;
                const u = users.find(x => String(x.User_ID) === String(id));
                return (u && u.Profile_Pic) || '';
            };

            const sessionInfos = useMemo(() => sessions
                .filter(s => s.Session_ID && String(s.Status || '').trim() !== '' && !isNaN(parseSessionDate(s.Date).getTime()))
                .map(s => ({ s, info: summarize(s, allRegistrations, rules) })),
                [sessions, allRegistrations, rules]);

            const homeList = useMemo(() => {
                const list = sessionInfos.filter(({ s, info }) => {
                    if (info.isPast && (!isAdminUser || info.isCancelled || TASKS.every(t => isTrue(s[t.key])))) return false;
                    const mine = info.regs.some(r => String(r.User_ID) === myId);
                    if (filterMyStatus === 'Joined' && !mine) return false;
                    if (filterMyStatus === 'NotJoined' && (mine || info.isPast || info.isCancelled)) return false;
                    if (filterDay === 'Weekend' && s.Type !== 'Weekend') return false;
                    return true;
                });
                return {
                    upcoming: list.filter(x => !x.info.isPast).sort((a, b) => a.info.date - b.info.date),
                    past: list.filter(x => x.info.isPast).sort((a, b) => b.info.date - a.info.date)
                };
            }, [sessionInfos, filterMyStatus, filterDay, myId, isAdminUser]);

            const selected = useMemo(
                () => selectedId ? sessionInfos.find(x => String(x.s.Session_ID) === String(selectedId)) || null : null,
                [sessionInfos, selectedId]);
            const selectedSession = selected ? selected.s : null;
            const info = selected ? selected.info : null;
            const currentRegs = info ? info.regs : [];
            const myReg = currentRegs.find(r => String(r.User_ID) === myId) || null;

            // ที่ว่างของแต่ละชั่วโมง (ไม่นับตัวเอง เผื่อกรณีแก้ไขเวลา)
            const others = currentRegs.filter(r => String(r.User_ID) !== myId);
            const h1Others = others.filter(inH1).length;
            const h2Others = others.filter(inH2).length;
            const cap = rules.WORKDAY_HOUR_CAP;
            const disableH1 = h1Others >= cap;
            const disableH2 = h2Others >= cap;
            const disableAll = disableH1 || disableH2;

            // ---------- effects ----------
            useEffect(() => {
                if (!selectedId) return;
                const onScroll = () => setIsScrolled(window.scrollY > 40);
                window.addEventListener('scroll', onScroll);
                return () => window.removeEventListener('scroll', onScroll);
            }, [selectedId]);

            useEffect(() => {
                if (selectedId) window.scrollTo(0, 0);
                else setTimeout(() => window.scrollTo(0, scrollPositionRef.current), 10);
            }, [selectedId]);

            useEffect(() => {
                setPendingTasks({});
                setIsEditing(false);
            }, [selectedId]);

            useEffect(() => {
                setExtraShuttles(selectedSession ? (Number(selectedSession.Extra_Shuttles) || 0) : 0);
            }, [selectedId, selectedSession && selectedSession.Extra_Shuttles]);

            useEffect(() => {
                if (!info) return;
                if (myReg) setSelectedHour(hoursOf(myReg));
                else if (!disableAll) setSelectedHour('All');
                else if (!disableH1) setSelectedHour(H1);
                else setSelectedHour(H2);
            }, [selectedId, myReg && myReg.Hours_Joined, isEditing]);

            // ข้อความสำหรับโพสต์ในกลุ่ม LINE
            useEffect(() => {
                if (!selected) return;
                const { s, info: si } = selected;
                const d = si.date;
                const head = `วัน${TH_DAYS[d.getDay()]}/${d.getDate()}/${d.getMonth() + 1}/${String(d.getFullYear()).slice(-2)}${s.Location ? ' ' + s.Location : ''}`;
                const c = si.costs;
                const costStr = `ค่าคอร์ด ${c.court} บาท + ค่าลูก ${c.shuttle} บาท\nคนละ ${c.perHead} บาท (หาร ${c.splitBy} คน${c.splitBy < rules.COST_SPLIT_BASE ? ` ถ้าครบ ${rules.COST_SPLIT_BASE} คนเหลือคนละ ${c.fullPerHead} บาท` : ''})`;
                const numbered = (list, minLines) => {
                    let t = '';
                    const n = Math.max(minLines, list.length);
                    for (let i = 0; i < n; i++) t += `${i + 1}.${list[i] ? ' ' + getUserName(list[i].User_ID) : ''}\n`;
                    return t;
                };
                let body;
                if (si.isWorkday && si.regs.every(r => hoursOf(r) === 'All')) {
                    body = `⌚18:00 - 20:00\n${numbered(si.regs, si.cap)}`;
                } else if (si.isWorkday) {
                    const l1 = si.regs.filter(inH1), l2 = si.regs.filter(inH2);
                    body = `⌚18:00 - 19:00\n${numbered(l1, si.cap)}\n⌚19:00 - 20:00\n${numbered(l2, si.cap)}`;
                } else {
                    body = `⌚16:00 - 18:00 (ขั้นต่ำ ${si.min} คน ลงได้ถึง ${fmtShort(si.lastRegDay)})\n${numbered(si.regs, Math.max(si.min, si.regs.length + 1))}`;
                }
                setLineText(renderLineTemplate(appSettings.LINE_POST_TEMPLATE, {
                    'วัน': `วัน${TH_DAYS[d.getDay()]} ${d.getDate()}-${d.getMonth() + 1}-${String(d.getFullYear()).slice(-2)}`,
                    'หัวข้อ': head, 'วันที่': fmtLong(d), 'สนาม': s.Location || '', 'เวลา': timeRange(si.isWorkday),
                    'ค่าคอร์ด': c.court, 'ค่าลูก': c.shuttle, 'คนละ': c.perHead, 'หาร': c.splitBy,
                    'ค่าใช้จ่าย': costStr, 'รายชื่อ': body.replace(/\n+$/, ''), 'ลิงก์': LIFF_URL
                }));
            }, [selected, nameById, rules, appSettings]);

            // ---------- handlers ----------
            const openSession = (id) => {
                scrollPositionRef.current = window.scrollY;
                setSelectedId(id);
            };
            const closeSession = () => { setSelectedId(null); setIsEditing(false); };

            const handleCreateProfile = async (name) => {
                setSubmitting(true);
                try {
                    const r = await sendApiRequest("createProfile", { display_name: name });
                    if (r.status === "success") { applyUser(r.data); await fetchAllData(); }
                    else showToast(r.message, "error");
                } catch (e) { showToast(e.message, "error"); }
                finally { setSubmitting(false); }
            };

            const handleLinkProfile = async (u) => {
                if (!window.confirm(`ยืนยันว่าคุณคือ "${u.DisplayName}" ใช่ไหม?\nเลือกแล้วเปลี่ยนเองไม่ได้`)) return;
                setSubmitting(true);
                try {
                    const r = await sendApiRequest("linkProfile", { user_id: u.User_ID });
                    if (r.status === "success") { applyUser(r.data); await fetchAllData(); }
                    else showToast(r.message, "error");
                } catch (e) { showToast(e.message, "error"); }
                finally { setSubmitting(false); }
            };

            const handleRegister = async () => {
                if (info.isWorkday && disableAll) return showToast('รอบนี้เต็มแล้ว', 'error');
                await runAction('register',
                    { session_id: selectedSession.Session_ID, hours_joined: 'All' },
                    'ลงชื่อสำเร็จ!');
            };

            const handleCancel = async () => {
                const ok = await runAction('cancel', { session_id: selectedSession.Session_ID }, 'ยกเลิกเรียบร้อย');
                if (ok) { setShowCancelConfirm(false); setIsEditing(false); }
            };

            const handleSaveExtraShuttles = () => runAction('updateTask', {
                session_id: selectedSession.Session_ID, task_key: 'Extra_Shuttles', task_value: extraShuttles
            }, 'บันทึกจำนวนลูกแล้ว');

            const handleTaskToggleLocal = (key) => {
                setPendingTasks(prev => {
                    const next = { ...prev };
                    const original = isTrue(selectedSession[key]);
                    const current = prev[key] !== undefined ? prev[key] : original;
                    next[key] = !current;
                    if (next[key] === original) delete next[key];
                    return next;
                });
            };

            const handleTaskSave = async () => {
                const ok = await runAction('updateTask', { session_id: selectedSession.Session_ID, tasks: pendingTasks }, 'อัปเดตเช็คลิสต์แล้ว');
                if (ok) setPendingTasks({});
            };

            const handleCopyLineText = async () => {
                try {
                    await navigator.clipboard.writeText(lineText);
                } catch (e) {
                    const ta = document.getElementById('line-export-text');
                    ta.select();
                    document.execCommand('copy');
                }
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            // แชร์ข้อความเข้ากลุ่ม LINE: ใช้ตัวเลือกกลุ่มของ LIFF ถ้ามี ไม่งั้นเปิดหน้าแชร์ของ LINE
            const handleShareLineText = async () => {
                const text = lineText.trim();
                if (!text) return;
                try {
                    if (liffReady && liff.isApiAvailable('shareTargetPicker')) {
                        const res = await liff.shareTargetPicker([{ type: 'text', text: text.slice(0, 5000) }]);
                        if (res && res.status === 'success') showToast('ส่งเข้า LINE แล้ว');
                        return;
                    }
                } catch (e) {
                    showToast('เปิดตัวเลือกกลุ่มไม่ได้ ใช้ปุ่มคัดลอกแทนได้', 'error');
                    return;
                }
                window.open('https://line.me/R/share?text=' + encodeURIComponent(text), '_blank');
            };

            // ---------- admin manager ----------
            const openAdminManager = () => {
                setAmData(currentRegs.map(r => ({ ...r })));
                setAmBase(currentRegs.map(r => ({ ...r })));
                setAmExistingId("");
                setAmNewName("");
                setAmNewHours("All");
                setAmWillCancel(info.isCancelled);
                setShowAdminManager(true);
            };

            const buildPendingAdd = () => {
                const base = { Hours_Joined: info.isWorkday ? amNewHours : 'All', Payment_Status: 'Unpaid', Timestamp: new Date().toISOString() };
                if (amExistingId) {
                    const u = users.find(x => String(x.User_ID) === amExistingId);
                    if (u) return { ...base, User_ID: String(u.User_ID), DisplayName: u.DisplayName };
                }
                const name = amNewName.trim();
                if (name) return { ...base, User_ID: 'NEW_' + Date.now(), DisplayName: name };
                return null;
            };

            const handleAdminAdd = () => {
                const row = buildPendingAdd();
                if (!row) return;
                if (amData.some(r => String(r.User_ID) === row.User_ID)) return showToast('มีชื่อนี้ในรอบแล้ว', 'error');
                setAmData([...amData, row]);
                setAmExistingId("");
                setAmNewName("");
                setAmNewHours("All");
            };

            const handleAdminSave = async () => {
                const data = [...amData];
                const pending = buildPendingAdd();
                if (pending && !data.some(r => String(r.User_ID) === pending.User_ID)) data.push(pending);

                const statusChanged = amWillCancel !== info.isCancelled;
                const d = diffRegs(amBase, data);
                const playersChanged = d.add.length + d.remove.length + d.update.length > 0;
                if (!statusChanged && !playersChanged) { setShowAdminManager(false); return; }

                setSubmitting(true);
                try {
                    // ส่งครั้งเดียว: สถานะรอบ + ส่วนต่างรายชื่อ ทำใน lock เดียวฝั่ง server (ไม่ค้างครึ่งทาง ไม่ทับคนอื่น)
                    const payload = { session_id: selectedSession.Session_ID, ...d };
                    if (statusChanged) payload.session_status = amWillCancel ? 'Cancelled' : 'Open';
                    const r = await sendApiRequest('adminUpdateRegistrations', payload);
                    if (r.status !== 'success') throw new Error(r.message);
                    showToast('บันทึกแล้ว');
                    setShowAdminManager(false);
                    await fetchAllData();
                } catch (e) {
                    showToast(e.message || 'บันทึกไม่สำเร็จ', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            // =================== RENDER ===================
            if (globalError) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 text-center">
                        <div className="bg-white p-8 rounded-[24px] shadow-sm max-w-sm w-full">
                            <div className="text-rose-500 mb-4 flex justify-center"><IconShield size={44} /></div>
                            <h2 className="text-xl font-bold mb-2 text-black">โหลดข้อมูลไม่ได้</h2>
                            <p className="text-gray-600 mb-6 text-[15px]">{globalError}</p>
                            <button onClick={() => window.location.reload()} className="w-full bg-[#007AFF] text-white py-3 rounded-[14px] font-semibold active:opacity-80">
                                ลองใหม่อีกครั้ง
                            </button>
                        </div>
                    </div>
                );
            }

            // ผู้ใช้ใหม่ (ยังไม่มีโปรไฟล์) ต้องรอรายชื่อสมาชิกโหลดก่อน ไม่งั้นรายชื่อ "เลือกชื่อเดิม" จะว่างแล้วสร้างโปรไฟล์ซ้ำ
            if (authLoading || (publicViewMode && loading) || (!publicViewMode && !currentUser && loading)) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-4">
                        <span className="text-5xl">🏸</span>
                        <IconLoader className="text-gray-400" />
                        <p className="text-[15px] text-gray-500">{publicViewMode ? 'กำลังโหลด...' : 'กำลังเข้าสู่ระบบด้วย LINE...'}</p>
                    </div>
                );
            }

            if (publicViewMode) return <PublicSessionView sessionInfos={sessionInfos} rules={rules} />;

            // ---------- ตั้งค่าโปรไฟล์ครั้งแรก ----------
            if (!currentUser) {
                const unlinkedUsers = users
                    .filter(u => !u.Linked)
                    .filter(u => !searchUserQuery || String(u.DisplayName || "").toLowerCase().includes(searchUserQuery.toLowerCase()))
                    .sort((a, b) => String(a.DisplayName || "").localeCompare(String(b.DisplayName || ""), 'th'));

                return (
                    <div className="min-h-screen p-4 pt-12">
                        <Toast message={toast.message} type={toast.type} />
                        {submitting && <GlobalLoader />}
                        <div className="w-full max-w-md mx-auto space-y-8">
                            <div className="flex flex-col items-center text-center">
                                {lineProfile && lineProfile.picture
                                    ? <img src={lineProfile.picture} alt="" className="w-20 h-20 rounded-full shadow-sm mb-3" />
                                    : <span className="text-6xl mb-3">🏸</span>}
                                <h2 className="text-[24px] font-semibold text-black">สวัสดี {lineProfile ? lineProfile.name : ''}</h2>
                                <p className="text-gray-500 mt-1 text-[15px]">ตั้งค่าโปรไฟล์ครั้งแรก ทำครั้งเดียวจบ</p>
                            </div>

                            <div>
                                <SectionTitle>มาครั้งแรก สร้างโปรไฟล์ใหม่</SectionTitle>
                                <div className="bg-white rounded-[20px] shadow-sm overflow-hidden">
                                    <input value={newUserName} onChange={e => setNewUserName(e.target.value)}
                                        placeholder={(lineProfile && lineProfile.name) || "ชื่อที่ใช้ในก๊วน"}
                                        className="w-full px-4 py-3.5 text-[17px] text-black outline-none border-b border-gray-200 placeholder-gray-400" />
                                    <button onClick={() => handleCreateProfile(newUserName.trim() || (lineProfile && lineProfile.name))} disabled={submitting}
                                        className="w-full py-3.5 text-[17px] text-[#007AFF] font-medium active:bg-gray-50 disabled:opacity-50">
                                        สร้างโปรไฟล์
                                    </button>
                                </div>
                            </div>

                            {users.some(u => !u.Linked) && (
                                <div>
                                    <SectionTitle>เคยลงชื่อแล้ว เลือกชื่อเดิมของคุณ</SectionTitle>
                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden">
                                        <div className="flex items-center px-4 py-3 border-b border-gray-200">
                                            <IconSearch className="text-gray-400 mr-3" size={20} />
                                            <input type="text" placeholder="ค้นหาชื่อ" value={searchUserQuery} onChange={e => setSearchUserQuery(e.target.value)}
                                                className="w-full bg-transparent outline-none text-[17px] text-black placeholder-gray-400" />
                                        </div>
                                        <div className="max-h-[45vh] overflow-y-auto no-scrollbar">
                                            {unlinkedUsers.map((u, i) => (
                                                <button key={u.User_ID} onClick={() => handleLinkProfile(u)} disabled={submitting}
                                                    className={`w-full text-left flex items-center justify-between px-4 py-3.5 active:bg-gray-100 ${i < unlinkedUsers.length - 1 ? 'border-b border-gray-200' : ''}`}>
                                                    <span className="text-[17px] text-black">{u.DisplayName}</span>
                                                    <IconChevronRight className="text-gray-300" size={20} />
                                                </button>
                                            ))}
                                            {unlinkedUsers.length === 0 && <div className="p-6 text-center text-gray-500 text-[15px]">ไม่พบชื่อนี้</div>}
                                        </div>
                                    </div>
                                    <p className="text-[13px] text-gray-500 px-4 mt-2">ประวัติการเล่นเดิมจะตามมาด้วย ถ้าเลือกผิดให้แจ้งแอดมิน</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ---------- หน้าแรก ----------
            const renderHome = () => {
                const emptyText = filterMyStatus === 'Joined' ? 'ยังไม่ได้ลงชื่อรอบไหน'
                    : filterMyStatus === 'NotJoined' ? 'ลงชื่อครบทุกรอบแล้ว'
                    : filterDay === 'Weekend' ? 'ยังไม่มีรอบวันหยุด'
                    : 'ยังไม่มีรอบตีที่เปิดอยู่';
                const tabs = [
                    { key: 'all', label: 'เร็ว ๆ นี้', Icon: TabIconClock, active: filterMyStatus === 'All' && filterDay === 'All', onClick: () => { setFilterMyStatus('All'); setFilterDay('All'); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
                    { key: 'joined', label: 'ลงแล้ว', Icon: TabIconCheck, active: filterMyStatus === 'Joined', onClick: () => { setFilterMyStatus(p => p === 'Joined' ? 'All' : 'Joined'); setFilterDay('All'); } },
                    { key: 'notjoined', label: 'ยังไม่ลง', Icon: TabIconPlus, active: filterMyStatus === 'NotJoined', onClick: () => { setFilterMyStatus(p => p === 'NotJoined' ? 'All' : 'NotJoined'); setFilterDay('All'); } },
                    { key: 'weekend', label: 'วันหยุด', Icon: TabIconSun, active: filterDay === 'Weekend', onClick: () => { setFilterDay(p => p === 'Weekend' ? 'All' : 'Weekend'); setFilterMyStatus('All'); } },
                    { key: 'point', label: 'ทวงแต้ม', Icon: TabIconCash, active: false, onClick: () => window.open(POINT_URL, '_blank') }
                ];

                return (
                    <>
                        <main className="max-w-md mx-auto w-full px-4 pb-32 animate-in" style={{ paddingTop: 'calc(env(safe-area-inset-top, 0px) + 2.5rem)' }}>
                            <h1 className="text-[34px] font-bold text-black mb-5 px-1 tracking-tight">{APP_NAME}</h1>

                            <div className="w-full bg-white rounded-[20px] mb-8 p-4 flex items-center gap-4 shadow-sm text-left">
                                {lineProfile && lineProfile.picture
                                    ? <img src={lineProfile.picture} alt="" className="w-[56px] h-[56px] rounded-full" />
                                    : <div className="w-[56px] h-[56px] bg-gray-100 rounded-full flex items-center justify-center text-3xl">🏸</div>}
                                <div className="flex-1 min-w-0">
                                    <div className="font-medium text-[20px] text-black truncate">{currentUser.DisplayName}</div>
                                    <div className="text-[13px] text-gray-500">{isAdminUser ? 'แอดมิน' : 'สมาชิก'}</div>
                                </div>
                                {isAdminUser && (
                                    <button onClick={() => { scrollPositionRef.current = 0; setShowAdminPage(true); }}
                                        className="shrink-0 px-4 h-8 rounded-full bg-gray-200/80 text-[15px] font-medium text-black active:opacity-70">จัดการข้อมูล</button>
                                )}
                            </div>

                            <SectionTitle>รอบที่กำลังจะมา</SectionTitle>

                            <div className="flex flex-col gap-3 mb-8">
                                {loading && sessionInfos.length === 0 ? (
                                    <><SessionSkeleton /><SessionSkeleton /><SessionSkeleton /></>
                                ) : homeList.upcoming.length === 0 ? (
                                    <div className="bg-white rounded-[20px] p-10 text-center shadow-sm">
                                        <div className="text-4xl mb-2">📭</div>
                                        <div className="text-gray-500 text-[15px]">{emptyText}</div>
                                    </div>
                                ) : homeList.upcoming.map(({ s, info: si }) => (
                                    <SessionCard key={s.Session_ID} s={s} info={si} rules={rules} myId={myId}
                                        getUserName={getUserName} getUserPicture={getUserPicture} showTasks={isAdminUser} onOpen={() => openSession(s.Session_ID)} />
                                ))}
                            </div>

                            {homeList.past.length > 0 && (
                                <>
                                    <SectionTitle>รอสรุปยอด</SectionTitle>
                                    <div className="flex flex-col gap-3">
                                        {homeList.past.map(({ s, info: si }) => (
                                            <SessionCard key={s.Session_ID} s={s} info={si} rules={rules} myId={myId}
                                                getUserName={getUserName} getUserPicture={getUserPicture} showTasks={isAdminUser} onOpen={() => openSession(s.Session_ID)} />
                                        ))}
                                    </div>
                                </>
                            )}
                        </main>

                        <BottomBar tabs={tabs} />
                    </>
                );
            };

            // ---------- หน้ารายละเอียดรอบ ----------
            const renderDetail = () => {
                const s = selectedSession;
                const si = info;
                const dim = si.isPast || si.isCancelled;
                // ตัวอย่างราคาคนละตอนแอดมินกดเพิ่ม/ลดลูก (ก่อนบันทึก)
                const lc = (() => {
                    const shuttleCount = rules.SHUTTLES_PER_SESSION + extraShuttles;
                    const shuttle = rules.SHUTTLECOCK_PRICE * shuttleCount;
                    const total = si.costs.court + shuttle;
                    return { ...si.costs, shuttleCount, shuttle, total, perHead: Math.ceil(total / si.costs.splitBy) };
                })();
                const collected = lc.perHead * currentRegs.length;
                const diff = collected - lc.total;
                const extraChanged = extraShuttles !== (Number(s.Extra_Shuttles) || 0);

                const rulesText = si.isWorkday
                    ? `รับสูงสุด ${si.cap} คน เป้าหมายขั้นต่ำ ${si.min} คน ลงชื่อหรือยกเลิกได้จนถึงวันเล่น`
                    : `ไม่จำกัดจำนวน แต่ต้องมีอย่างน้อย ${si.min} คน ลงชื่อได้ถึง${TH_DAYS[si.lastRegDay.getDay()]}ที่ ${si.lastRegDay.getDate()} ${TH_MONTHS_SHORT[si.lastRegDay.getMonth()]} ถ้าไม่ครบระบบจะงดรอบและแจ้งทาง LINE`;

                const closedReason = si.isPast ? 'รอบนี้จบแล้ว'
                    : !si.isOpen ? 'รอบนี้ปิดรับลงชื่อ'
                    : (!si.isWorkday && si.weekendClosed) ? `ปิดรับลงชื่อแล้ว (ปิดก่อนวันเล่น ${rules.WEEKEND_CLOSE_DAYS} วัน)`
                    : 'เต็มทั้ง 2 ชั่วโมงแล้ว';

                const oneHourPlayers = si.isWorkday && currentRegs.some(r => hoursOf(r) !== 'All');
                const PlayerBox = ({ title, list, target }) => (
                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden">
                        <div className="px-4 py-3 bg-gray-50/60 border-b border-gray-100 flex justify-between items-center">
                            <span className="text-[16px] font-semibold text-gray-700">{title}</span>
                            <span className="text-[15px] text-gray-500 tabular-nums">{target ? `${list.length}/${target}` : `${list.length} คน`}</span>
                        </div>
                        <div className="p-4 flex flex-wrap gap-2">
                            {list.length === 0 && <span className="text-gray-400 text-[14px]">ยังไม่มี</span>}
                            {list.map((p, i) => <NameChip key={i} size="lg" name={getUserName(p.User_ID)} picture={getUserPicture(p.User_ID)} isMe={String(p.User_ID) === myId} />)}
                        </div>
                    </div>
                );

                return (
                    <div className="w-full max-w-md mx-auto pb-24 animate-in">
                        {/* Nav */}
                        <div style={{ paddingTop: 'calc(env(safe-area-inset-top, 0px) + 0.75rem)' }} className={`sticky top-0 z-50 flex items-center justify-between px-4 pb-3 mb-2 transition-all duration-300 ${isScrolled ? 'bg-white/95 backdrop-blur-md border-b border-gray-200/50 shadow-sm' : ''}`}>
                            <button onClick={closeSession} className="w-8 h-8 rounded-full bg-gray-200/80 flex items-center justify-center text-black active:opacity-70 relative z-10">
                                <IconChevronLeft size={22} className="-ml-0.5" />
                            </button>
                            <div className={`absolute left-1/2 -translate-x-1/2 font-semibold text-[17px] text-black transition-opacity ${isScrolled ? 'opacity-100' : 'opacity-0'}`}>
                                {fmtShort(si.date)}
                            </div>
                            {isAdminUser
                                ? <button onClick={openAdminManager} className="px-4 h-8 rounded-full bg-gray-200/80 text-[15px] font-medium text-black active:opacity-70 relative z-10">จัดการ</button>
                                : <div className="w-8 h-8" />}
                        </div>

                        <div className="px-4">
                            {/* Info */}
                            <div className={`bg-white rounded-[20px] shadow-sm p-5 mb-8 ${dim ? 'opacity-80' : ''}`}>
                                <DateTile date={si.date} dim={dim} size="lg" />
                                <h1 className="text-[28px] font-bold text-black mt-4 mb-2 tracking-tight leading-tight">
                                    {fmtLong(si.date)}{si.isCancelled && ' (งด)'}
                                </h1>
                                <p className={`font-semibold text-[17px] mb-2 ${si.isCancelled ? 'text-gray-400 line-through' : 'text-black'}`}>
                                    {timeRange(si.isWorkday)} • {s.Location}
                                </p>
                                <p className="text-[15px] text-gray-500 leading-relaxed">{rulesText}</p>
                            </div>

                            {/* Registration */}
                            <SectionTitle>ลงชื่อ</SectionTitle>
                            <div className="bg-white rounded-[20px] shadow-sm overflow-hidden mb-8">
                                {si.isCancelled ? (
                                    <div className="p-5 text-center text-[15px] text-gray-500">รอบนี้งดเล่น</div>
                                ) : myReg && !isEditing ? (
                                    <>
                                        <Row label="สถานะ" value={<span className={si.isPast ? 'text-gray-500' : 'text-[#34C759]'}>ลงชื่อแล้ว</span>} />
                                        <Row label="เวลาเล่น" value={hoursLabel(hoursOf(myReg), si.isWorkday)} last={si.isPast} />
                                        {si.isPast ? null : (
                                            <>
                                                <button onClick={() => setShowCancelConfirm(true)} disabled={submitting}
                                                    className="w-full p-4 text-center text-[#FF3B30] text-[17px] active:bg-gray-50">
                                                    ไม่สะดวกเล่นแล้ว
                                                </button>
                                            </>
                                        )}
                                    </>
                                ) : (!myReg && !si.canRegister) ? (
                                    <div className="p-6 text-center">
                                        <IconClock size={30} className="text-gray-300 mx-auto mb-2" />
                                        <div className="text-[17px] font-medium text-black">{closedReason}</div>
                                    </div>
                                ) : (
                                    <>
                                        <Row label="เวลา" value={timeRange(si.isWorkday)} />
                                        <Row label="ค่าใช้จ่าย" value={`คนละ ${lc.perHead} ฿`} />
                                        <button type="button" onClick={handleRegister} disabled={submitting}
                                            className="w-full p-4 text-center font-semibold text-[#007AFF] text-[17px] active:bg-gray-50 disabled:opacity-50">
                                            {submitting ? 'กำลังบันทึก...' : 'ลงชื่อ'}
                                        </button>
                                    </>
                                )}
                            </div>

                            {/* Players */}
                            <SectionTitle right={`รวม ${currentRegs.length} คน`}>รายชื่อ</SectionTitle>
                            <div className="flex flex-col gap-3 mb-8">
                                {si.isWorkday ? (
                                    oneHourPlayers ? (
                                        <>
                                            <PlayerBox title="18:00 - 19:00" list={currentRegs.filter(inH1)} target={si.cap} />
                                            <PlayerBox title="19:00 - 20:00" list={currentRegs.filter(inH2)} target={si.cap} />
                                        </>
                                    ) : (
                                        <PlayerBox title="เล่น 2 ชั่วโมง" list={currentRegs} target={si.cap} />
                                    )
                                ) : (
                                    <PlayerBox title="16:00 - 18:00" list={currentRegs} target={null} />
                                )}
                            </div>

                            {/* Cost */}
                            {!si.isCancelled && (
                                <>
                                    <SectionTitle>ค่าใช้จ่าย</SectionTitle>
                                    <div className="bg-white rounded-[20px] shadow-sm overflow-hidden mb-8">
                                        <Row label="ค่าคอร์ด" value={`${si.costs.court} ฿`} />
                                        <Row label={`ลูกแบด ${lc.shuttleCount} ลูก`} value={`${lc.shuttle} ฿`} />
                                        <div className={`p-4 flex justify-between items-center ${isAdminUser ? 'border-b border-gray-200' : ''}`}>
                                            <span className="text-[17px] font-semibold text-black">คนละ</span>
                                            <span className="text-[22px] font-bold text-[#34C759] tabular-nums">{lc.perHead} ฿</span>
                                        </div>

                                        {isAdminUser && (
                                            <div className="p-4 flex justify-between items-center">
                                                <div>
                                                    <div className="text-[17px] text-black">เติมลูกเพิ่มหน้างาน</div>
                                                    {extraChanged && <div className="text-[13px] text-[#FF9500]">ยังไม่ได้บันทึก</div>}
                                                </div>
                                                <div className="flex items-center gap-3 bg-[#E9E9EA] rounded-[10px] p-1">
                                                    <button onClick={() => setExtraShuttles(Math.max(0, extraShuttles - 1))} className="w-8 h-8 rounded-[8px] bg-white shadow-sm text-lg active:opacity-70">-</button>
                                                    <span className="font-semibold text-[17px] w-5 text-center tabular-nums">{extraShuttles}</span>
                                                    <button onClick={() => setExtraShuttles(Math.min(20, extraShuttles + 1))} className="w-8 h-8 rounded-[8px] bg-white shadow-sm text-lg active:opacity-70">+</button>
                                                </div>
                                            </div>
                                        )}
                                        {isAdminUser && currentRegs.length > 0 && (
                                            <div className="px-4 py-3 bg-gray-50 border-t border-gray-200 flex justify-between text-[14px]">
                                                <span className="text-gray-500">เก็บได้ {currentRegs.length} × {lc.perHead}</span>
                                                <span className={diff >= 0 ? 'text-emerald-600 font-medium' : 'text-rose-600 font-medium'}>
                                                    {collected} ฿ ({diff >= 0 ? 'เกิน' : 'ขาด'} {Math.abs(diff)} ฿)
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                    {isAdminUser && extraChanged && (
                                        <div className="-mt-6 mb-8 flex gap-2">
                                            <button onClick={() => setExtraShuttles(Number(s.Extra_Shuttles) || 0)} className="flex-1 bg-white text-[#FF3B30] font-semibold py-3 rounded-[14px] shadow-sm active:opacity-70">ยกเลิก</button>
                                            <button onClick={handleSaveExtraShuttles} disabled={submitting} className="flex-[2] bg-[#007AFF] text-white font-semibold py-3 rounded-[14px] active:opacity-80 disabled:opacity-50">บันทึกจำนวนลูก</button>
                                        </div>
                                    )}
                                </>
                            )}

                            {/* Admin checklist */}
                            {isAdminUser && !si.isCancelled && (
                                <div className="mb-8">
                                    <SectionTitle>เช็คลิสต์แอดมิน</SectionTitle>
                                    <div className="bg-white rounded-[20px] overflow-hidden shadow-sm">
                                        {TASKS.map((task, i) => {
                                            const checked = pendingTasks[task.key] !== undefined ? pendingTasks[task.key] : isTrue(s[task.key]);
                                            return (
                                                <div key={task.key} onClick={() => !submitting && handleTaskToggleLocal(task.key)}
                                                    className={`p-4 flex justify-between items-center active:bg-gray-50 cursor-pointer ${i < TASKS.length - 1 ? 'border-b border-gray-200' : ''}`}>
                                                    <span className={`text-[17px] ${checked ? 'text-gray-400 line-through' : 'text-black'}`}>{task.label}</span>
                                                    <span role="switch" aria-checked={checked}
                                                        className={`${checked ? 'bg-[#34C759]' : 'bg-[#E9E9EA]'} relative inline-flex h-[31px] w-[51px] shrink-0 rounded-full transition-colors duration-300`}>
                                                        <span className={`${checked ? 'translate-x-[22px]' : 'translate-x-[2px]'} inline-block h-[27px] w-[27px] mt-[2px] rounded-full bg-white shadow transition duration-300`} />
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    {Object.keys(pendingTasks).length > 0 && (
                                        <div className="mt-3 flex gap-2">
                                            <button onClick={() => setPendingTasks({})} className="flex-1 bg-white text-[#FF3B30] font-semibold py-3 rounded-[14px] shadow-sm active:opacity-70">ยกเลิก</button>
                                            <button onClick={handleTaskSave} disabled={submitting} className="flex-[2] bg-[#007AFF] text-white font-semibold py-3 rounded-[14px] active:opacity-80 disabled:opacity-50">บันทึกเช็คลิสต์</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* LINE text */}
                            {isAdminUser && (
                                <div className="mb-8">
                                    <SectionTitle right={
                                        <span className="flex items-center gap-4">
                                            <button onClick={handleCopyLineText} className={`text-[15px] font-medium ${copied ? 'text-[#34C759]' : 'text-[#007AFF] active:opacity-70'}`}>
                                                {copied ? 'คัดลอกแล้ว' : 'คัดลอก'}
                                            </button>
                                            <button onClick={handleShareLineText} className="text-[15px] font-medium text-[#06C755] active:opacity-70">แชร์เข้า LINE</button>
                                        </span>
                                    }>ข้อความโพสต์ LINE</SectionTitle>
                                    <div className="bg-white rounded-[20px] overflow-hidden shadow-sm">
                                        <textarea id="line-export-text" rows="16" value={lineText} onChange={e => setLineText(e.target.value)}
                                            className="w-full p-4 text-[15px] text-black bg-transparent outline-none resize-y" />
                                    </div>
                                    <p className="text-[13px] text-gray-500 px-4 mt-2">แก้ข้อความก่อนคัดลอกหรือแชร์ได้</p>
                                </div>
                            )}
                        </div>

                        {/* Admin manager */}
                        {showAdminManager && (
                            <div className="fixed inset-0 z-[100] flex flex-col bg-[#F2F2F7] sheet-in">
                                <div className="flex items-center justify-between px-4 py-3 bg-white/85 backdrop-blur-md border-b border-gray-200 pt-safe">
                                    <button onClick={() => setShowAdminManager(false)} className="text-[17px] text-[#007AFF]">ยกเลิก</button>
                                    <h3 className="text-[17px] font-semibold text-black">จัดการรายชื่อ</h3>
                                    <button onClick={handleAdminSave} disabled={submitting} className="text-[17px] text-[#007AFF] font-semibold disabled:opacity-50">บันทึก</button>
                                </div>

                                <div className="flex-1 overflow-y-auto pb-10">
                                    <div className="mt-6">
                                        <SectionTitle>รายชื่อ ({amData.length})</SectionTitle>
                                        <div className="bg-white border-y border-gray-200 divide-y divide-gray-200">
                                            {amData.length === 0 ? (
                                                <div className="p-4 text-center text-[17px] text-gray-500">ยังไม่มีผู้เล่น</div>
                                            ) : amData.map((reg, idx) => (
                                                <div key={idx} className="p-4 flex items-center gap-3">
                                                    <span className="flex-1 text-[17px] font-medium text-black truncate">{nameById[String(reg.User_ID)] || reg.DisplayName}</span>
                                                    {si.isWorkday && (
                                                        <select value={hoursOf(reg)}
                                                            onChange={e => setAmData(amData.map((r, i) => i === idx ? { ...r, Hours_Joined: e.target.value } : r))}
                                                            className="bg-gray-100 rounded-[8px] px-2 py-1.5 text-[14px] font-medium outline-none">
                                                            <option value="All">2 ชม.</option>
                                                            <option value={H1}>{H1}</option>
                                                            <option value={H2}>{H2}</option>
                                                        </select>
                                                    )}
                                                    <button onClick={() => setAmData(amData.filter((_, i) => i !== idx))}
                                                        className="w-8 h-8 rounded-full bg-[#FF3B30]/10 flex items-center justify-center text-[#FF3B30] active:bg-[#FF3B30]/20">
                                                        <IconTrash size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-8">
                                        <SectionTitle>เพิ่มผู้เล่น</SectionTitle>
                                        <div className="bg-white border-y border-gray-200 divide-y divide-gray-200">
                                            <div className="p-3 pl-4 flex items-center">
                                                <span className="text-[17px] text-black w-24">จากระบบ</span>
                                                <select value={amExistingId} onChange={e => { setAmExistingId(e.target.value); setAmNewName(""); }}
                                                    className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right">
                                                    <option value="">เลือก</option>
                                                    {[...users].sort((a, b) => String(a.DisplayName).localeCompare(String(b.DisplayName), 'th'))
                                                        .map(u => <option key={u.User_ID} value={String(u.User_ID)}>{u.DisplayName}</option>)}
                                                </select>
                                            </div>
                                            <div className="p-3 pl-4 flex items-center">
                                                <span className="text-[17px] text-black w-24">ชื่อใหม่</span>
                                                <input type="text" placeholder="พิมพ์ชื่อ" value={amNewName}
                                                    onChange={e => { setAmNewName(e.target.value); setAmExistingId(""); }}
                                                    className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right placeholder-gray-300" />
                                            </div>
                                            {si.isWorkday && (
                                                <div className="p-3 pl-4 flex items-center">
                                                    <span className="text-[17px] text-black w-24">ชั่วโมง</span>
                                                    <select value={amNewHours} onChange={e => setAmNewHours(e.target.value)}
                                                        className="flex-1 text-[17px] text-[#007AFF] bg-transparent outline-none text-right">
                                                        <option value="All">2 ชั่วโมง</option>
                                                        <option value={H1}>{H1}</option>
                                                        <option value={H2}>{H2}</option>
                                                    </select>
                                                </div>
                                            )}
                                            <button onClick={handleAdminAdd} className="w-full p-3 text-[#007AFF] font-medium text-[17px] active:bg-gray-50">เพิ่มลงรายชื่อ</button>
                                        </div>
                                        <p className="text-[13px] text-gray-500 px-4 mt-2">แอดมินเพิ่มได้เกินโควตา ระบบไม่บล็อก</p>
                                    </div>

                                    <div className="mt-8">
                                        <SectionTitle>ตั้งค่ารอบ</SectionTitle>
                                        <div className="bg-white border-y border-gray-200">
                                            <label className="p-3 px-4 flex items-center justify-between cursor-pointer">
                                                <span className="text-[17px] text-[#FF3B30]">งดรอบนี้</span>
                                                <input type="checkbox" checked={amWillCancel} onChange={e => setAmWillCancel(e.target.checked)} className="sr-only peer" />
                                                <span className="w-[51px] h-[31px] bg-[#E9E9EA] rounded-full relative transition-colors peer-checked:bg-[#FF3B30] after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-[27px] after:w-[27px] after:shadow after:transition-all peer-checked:after:translate-x-[20px]" />
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Cancel confirm */}
                        {showCancelConfirm && (
                            <div className="fixed inset-0 z-[150] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm">
                                <div className="bg-white px-6 py-6 rounded-[24px] shadow-xl flex flex-col items-center gap-3 w-[85%] max-w-sm text-center animate-in">
                                    <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center text-red-500"><IconShield size={24} /></div>
                                    <h3 className="text-xl font-bold text-black">ไม่สะดวกเล่นแล้วใช่ไหม?</h3>
                                    <p className="text-[15px] text-gray-500">ระบบจะแจ้งแอดมินทาง LINE และเปิดที่ว่างให้คนอื่น</p>
                                    <div className="flex w-full gap-3 mt-3">
                                        <button onClick={() => setShowCancelConfirm(false)} disabled={submitting} className="flex-1 py-3.5 rounded-[14px] bg-gray-100 text-gray-600 font-semibold text-[17px] active:bg-gray-200">ปิด</button>
                                        <button onClick={handleCancel} disabled={submitting} className="flex-1 py-3.5 rounded-[14px] bg-[#FF3B30] text-white font-semibold text-[17px] active:opacity-80 flex justify-center items-center">
                                            {submitting ? <IconLoader size={18} className="text-white" /> : 'ยืนยันยกเลิก'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative">
                    <Toast message={toast.message} type={toast.type} />
                    {submitting && <GlobalLoader />}
                    {showAdminPage && isAdminUser
                        ? <AdminPanel sessions={sessions} users={users} registrations={allRegistrations} limits={ruleLimits}
                            sendApiRequest={sendApiRequest} onChanged={fetchAllData} onClose={() => setShowAdminPage(false)} showToast={showToast} />
                        : selected ? renderDetail() : renderHome()}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<BadmintonApp />);
    </script>
</body>
</html>
