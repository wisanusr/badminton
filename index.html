<!DOCTYPE html>
<html lang="th">

    <script>
        window.onerror = function (msg, url, lineNo) {
            var root = document.getElementById('root');
            if (root) root.innerHTML = '<div style="padding:20px;color:#c00;font-size:15px"><b>🚨 ระบบเกิดข้อผิดพลาด:</b><br/>' + msg + '<br/><br/>Line: ' + lineNo + '</div>';
            return false;
        };
    </script>
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['"Google Sans"', '"Noto Sans Thai"', 'sans-serif'] } } }

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

        body { font-family: 'Google Sans', 'Noto Sans Thai', sans-serif; background: #F2F2F7; -webkit-tap-highlight-color: transparent; }
        .animate-in { animation: animateIn 0.35s ease-out; }
        @keyframes animateIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .sheet-in { animation: sheetIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* กระจกแบบ iOS 26 (Liquid Glass): พื้นโปร่ง + เบลอ + เพิ่มความสด + ขอบสะท้อนแสงด้านในและเงานุ่มด้านนอก */
        .glass-bar {
            background: rgba(255, 255, 255, 0.42);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            backdrop-filter: blur(22px) saturate(180%);
            box-shadow:
                inset 0 1.5px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(255, 255, 255, 0.35),
                inset 1px 0 0 rgba(255, 255, 255, 0.5),
                inset -1px 0 0 rgba(255, 255, 255, 0.5),
                0 10px 32px rgba(0, 0, 0, 0.14),
                0 2px 6px rgba(0, 0, 0, 0.06);
            border: 0.5px solid rgba(255, 255, 255, 0.55);
        }
        .glass-pill {
            background: rgba(255, 255, 255, 0.55);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.95),
                inset 0 -1px 2px rgba(0, 0, 0, 0.05),
                0 2px 8px rgba(0, 0, 0, 0.1);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass-bar { background: rgba(255, 255, 255, 0.92); }
        }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        @media (prefers-reduced-motion: reduce) { .animate-in, .sheet-in { animation: none; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ===================== ตั้งค่า =====================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwT7wnsmZlxZ3L_5arhyZYW9CI4Xzw7Pe-wCHcAIlJTxULLKGb_P2lL50Ko5JCoudTz3w/exec"; // URL ของ Apps Script (ลงท้าย /exec)
        const LIFF_ID = "2011972483-Ji3vTjW3";                              // LIFF ID จาก LINE Developers
        const APP_NAME = "แทนที่จะตีแบด";
        const POINT_URL = "https://lin.ee/pIMi2X1";
        const LIFF_URL = `https://liff.line.me/${LIFF_ID}`;
        let liffReady = false;

        // ค่าเริ่มต้นของกติกา (ค่าจริงอ่านจากชีท Settings ชุดเดียวกับ backend/Rules.gs)
        const DEFAULT_RULES = {
            WORKDAY_HOUR_CAP: 8,
            WEEKEND_CLOSE_DAYS: 2,
            WEEKEND_MIN_PLAYERS: 6,
            WORKDAY_MIN_PLAYERS: 6,
            COST_SPLIT_BASE: 6,
            SHUTTLES_PER_SESSION: 2,
            SHUTTLECOCK_PRICE: 65
        };

        const DAY_GRADIENTS = [
            "bg-gradient-to-br from-red-400 to-[#FF3B30] text-white shadow-red-500/30",
            "bg-gradient-to-br from-yellow-300 to-[#FFCC00] text-white shadow-yellow-500/30",
            "bg-gradient-to-br from-pink-400 to-[#FF2D55] text-white shadow-pink-500/30",
            "bg-gradient-to-br from-green-400 to-[#34C759] text-white shadow-green-500/30",
            "bg-gradient-to-br from-orange-400 to-[#FF9500] text-white shadow-orange-500/30",
            "bg-gradient-to-br from-[#47A1FF] to-[#007AFF] text-white shadow-blue-500/30",
            "bg-gradient-to-br from-purple-400 to-[#AF52DE] text-white shadow-purple-500/30"
        ];
        const DIM_TILE = "bg-gradient-to-br from-gray-200 to-gray-300 text-gray-600 shadow-gray-500/20";
        const TH_DAYS_SHORT = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        const TH_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
        const TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        // เช็คลิสต์แอดมินหลังเล่น (Task1 เดิม "จองคอร์ด" เลิกใช้แล้ว Task3 เดิมใช้เป็น "เพิ่มลูกแบด")
        const TASKS = [
            { key: 'Task3', label: 'เพิ่มลูกแบด' },
            { key: 'Task2', label: 'เก็บเงิน' },
            { key: 'Task4', label: 'แจกแต้ม' },
            { key: 'Task5', label: 'โอนเงินเข้าบัญชี' }
        ];
        const TONES = {
            green: 'text-emerald-700 bg-emerald-50',
            amber: 'text-amber-700 bg-amber-50',
            red: 'text-rose-600 bg-rose-50',
            gray: 'text-gray-500 bg-gray-100'
        };
        const H1 = '18:00-19:00';
        const H2 = '19:00-20:00';

        // ===================== helpers =====================
        const DEFAULT_LINE_TEMPLATE = "{วัน}\n{สนาม}\n\n{รายชื่อ}\n\n🏸🏸🏸🏸🏸\nลงชื่อตีแบด {ลิงก์}";
        const renderLineTemplate = (tpl, vars) =>
            String(tpl || DEFAULT_LINE_TEMPLATE).replace(/\{([^{}\n]+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
        // กติกาจริงมาจาก server (data.rules: ตรวจช่วงแล้ว ตัวเดียวกับที่ server ใช้ตัดสิน จึงไม่ต้องเก็บช่วงค่าซ้ำที่นี่)
        // ถ้า server ยังไม่ส่ง rules (Apps Script เวอร์ชันเก่า) ใช้ค่าจาก Settings ตรงๆ โดยกันตัวหารเป็นศูนย์
        const readRules = (serverRules, settings = {}) => {
            const r = { ...DEFAULT_RULES };
            if (serverRules) {
                Object.keys(r).forEach(k => { if (typeof serverRules[k] === 'number') r[k] = serverRules[k]; });
                return r;
            }
            Object.keys(r).forEach(k => {
                const raw = settings[k];
                if (raw !== undefined && raw !== "" && !isNaN(Number(raw))) r[k] = Number(raw);
            });
            if (r.COST_SPLIT_BASE < 1) r.COST_SPLIT_BASE = DEFAULT_RULES.COST_SPLIT_BASE;
            return r;
        };
        // ส่วนต่างของรายชื่อ (base = ตอนเปิดหน้าแก้ไข, next = หลังแก้) ส่งเฉพาะที่เปลี่ยน ไม่ทับคนที่ลง/ยกเลิกระหว่างนั้น
        const diffRegs = (base, next) => {
            const baseMap = {}; base.forEach(r => { baseMap[String(r.User_ID)] = hoursOf(r); });
            const nextIds = {}; next.forEach(r => { nextIds[String(r.User_ID)] = true; });
            return {
                add: next.filter(r => baseMap[String(r.User_ID)] === undefined)
                    .map(r => ({ User_ID: String(r.User_ID), DisplayName: r.DisplayName, Hours_Joined: hoursOf(r), Payment_Status: r.Payment_Status, Timestamp: r.Timestamp })),
                remove: base.filter(r => !nextIds[String(r.User_ID)]).map(r => String(r.User_ID)),
                update: next.filter(r => baseMap[String(r.User_ID)] !== undefined && baseMap[String(r.User_ID)] !== hoursOf(r))
                    .map(r => ({ User_ID: String(r.User_ID), Hours_Joined: hoursOf(r) }))
            };
        };
        const isTrue = v => v === true || v === "TRUE" || v === "true" || v === "Y";
        const hoursOf = r => String(r.Hours_Joined || "All");
        const inH1 = r => { const h = hoursOf(r); return h === "All" || h.startsWith("18:00") || h.startsWith("16:00"); };
        const inH2 = r => { const h = hoursOf(r); return h === "All" || h.startsWith("19:00") || h.startsWith("17:00"); };

        const parseSessionDate = (v) => {
            const d = new Date(v);
            if (isNaN(d.getTime())) return d;
            if (d.getFullYear() > 2400) d.setFullYear(d.getFullYear() - 543);
            d.setHours(0, 0, 0, 0);
            return d;
        };
        const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
        const daysFromToday = (d) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d - t) / 86400000); };
        const fmtShort = d => `${TH_DAYS_SHORT[d.getDay()]} ${d.getDate()} ${TH_MONTHS_SHORT[d.getMonth()]}`;
        const fmtLong = d => `${TH_DAYS[d.getDay()]} ${d.getDate()} ${TH_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
        const timeRange = isWorkday => isWorkday ? '18:00-20:00' : '16:00-18:00';
        const hoursLabel = (h, isWorkday) => {
            if (!isWorkday) return '16:00-18:00';
            return h === 'All' ? '2 ชั่วโมง (18:00-20:00)' : h;
        };

        // สรุปสถานะของรอบตีหนึ่งรอบตามกติกา
        const summarize = (s, allRegs, rules) => {
            const regs = allRegs.filter(r => String(r.Session_ID) === String(s.Session_ID));
            const date = parseSessionDate(s.Date);
            const days = daysFromToday(date);
            const isWorkday = s.Type === 'Workday';
            const isCancelled = s.Status === 'Cancelled';
            const isOpen = s.Status === 'Open';
            const isPast = days < 0;
            const cap = rules.WORKDAY_HOUR_CAP;
            const min = isWorkday ? rules.WORKDAY_MIN_PLAYERS : rules.WEEKEND_MIN_PLAYERS;
            const h1 = regs.filter(inH1).length;
            const h2 = regs.filter(inH2).length;
            const weekendClosed = !isWorkday && days < rules.WEEKEND_CLOSE_DAYS;
            const lastRegDay = addDays(date, -rules.WEEKEND_CLOSE_DAYS);

            const court = parseFloat(s.Cost) || (isWorkday ? 200 : 120);
            const extraShuttles = Math.max(0, Number(s.Extra_Shuttles) || 0);   // ลูกที่เติมเพิ่มหน้างาน เก็บเงินหน้างานรวมใน "คนละ"
            const shuttleCount = rules.SHUTTLES_PER_SESSION + extraShuttles;
            const shuttle = rules.SHUTTLECOCK_PRICE * shuttleCount;
            const total = court + shuttle;
            // หารตามจำนวนคนจริง แต่ไม่เกิน COST_SPLIT_BASE (มาเกินกว่านี้ก็จ่ายเท่าราคาหาร 6)
            // ยังไม่มีคนลงชื่อ → แสดงราคาตอนครบ COST_SPLIT_BASE
            const splitBy = regs.length > 0 ? Math.min(regs.length, rules.COST_SPLIT_BASE) : rules.COST_SPLIT_BASE;
            const perHead = Math.ceil(total / splitBy);
            const fullPerHead = Math.ceil(total / rules.COST_SPLIT_BASE);

            let badge;
            if (isCancelled) badge = { text: 'งด', tone: 'red' };
            else if (isPast) badge = { text: 'จบแล้ว', tone: 'gray' };
            else if (!isOpen) badge = { text: 'ปิดรับ', tone: 'gray' };
            else if (isWorkday) {
                if (h1 >= cap && h2 >= cap) badge = { text: 'เต็มแล้ว', tone: 'red' };
                else if (h1 >= cap || h2 >= cap) badge = { text: 'เต็ม 1 ชม.', tone: 'amber' };
                else if (regs.length < min) badge = { text: `ขาดอีก ${min - regs.length} คน`, tone: 'amber' };
                else badge = { text: 'ครบแล้ว', tone: 'green' };
            } else if (weekendClosed) {
                badge = regs.length >= min ? { text: 'ได้ไปต่อ', tone: 'green' } : { text: 'รอยืนยัน', tone: 'gray' };
            } else {
                const need = min - regs.length;
                badge = need > 0 ? { text: `ขาดอีก ${need} คน`, tone: 'amber' } : { text: 'ครบแล้ว', tone: 'green' };
            }

            const canRegister = isOpen && !isPast && (isWorkday ? (h1 < cap || h2 < cap) : !weekendClosed);

            return {
                regs, date, days, isWorkday, isCancelled, isOpen, isPast, cap, min, h1, h2,
                weekendClosed, lastRegDay, canRegister, badge,
                costs: { court, shuttle, shuttleCount, extraShuttles, total, perHead, splitBy, fullPerHead }
            };
        };

        // ===================== Icons =====================
        const Svg = ({ size, className, children }) => (
            <svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{children}</svg>
        );
        const IconChevronLeft = ({ size = 20, className = "" }) => <Svg size={size} className={className}><polyline points="15 18 9 12 15 6" /></Svg>;
        const IconChevronRight = ({ size = 20, className = "" }) => <Svg size={size} className={className}><polyline points="9 18 15 12 9 6" /></Svg>;
        const IconClock = ({ size = 14, className = "" }) => <Svg size={size} className={className}><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></Svg>;
        const IconCheckCircle = ({ size = 20, className = "" }) => <Svg size={size} className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></Svg>;
        const IconCircle = ({ size = 20, className = "" }) => <Svg size={size} className={className}><circle cx="12" cy="12" r="10" /></Svg>;
        const IconSun = ({ size = 20, className = "" }) => <Svg size={size} className={className}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></Svg>;
        const IconBanknote = ({ size = 16, className = "" }) => <Svg size={size} className={className}><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></Svg>;
        const IconShield = ({ size = 16, className = "" }) => <Svg size={size} className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></Svg>;
        const IconSearch = ({ size = 18, className = "" }) => <Svg size={size} className={className}><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></Svg>;
        const IconTrash = ({ size = 16, className = "" }) => <Svg size={size} className={className}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></Svg>;
        const IconLoader = ({ size = 24, className = "" }) => <Svg size={size} className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></Svg>;

        // ===================== Small components =====================
        const GlobalLoader = () => (
            <div className="fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/30 backdrop-blur-sm">
                <div className="bg-white/90 px-8 py-6 rounded-[24px] shadow-xl flex flex-col items-center gap-3">
                    <IconLoader className="text-[#007AFF]" size={28} />
                    <p className="text-[14px] font-medium text-gray-600">กำลังบันทึก...</p>
                </div>
            </div>
        );

        const Toast = ({ message, type }) => {
            if (!message) return null;
            return (
                <div className="fixed top-3 left-1/2 -translate-x-1/2 z-[400] animate-in flex items-center gap-2.5 px-4 py-3 rounded-[18px] bg-white shadow-lg border border-gray-100 max-w-[90vw]" style={{ marginTop: 'env(safe-area-inset-top, 0px)' }}>
                    {type === 'error' ? <IconShield className="text-rose-500 shrink-0" size={20} /> : <IconCheckCircle className="text-[#34C759] shrink-0" size={20} />}
                    <span className="text-[15px] font-medium text-black">{message}</span>
                </div>
            );
        };

        const SectionTitle = ({ children, right }) => (
            <h3 className="text-[13px] font-medium text-gray-500 px-4 mb-2 flex justify-between items-center">
                <span>{children}</span>
                {right && <span>{right}</span>}
            </h3>
        );

        const Row = ({ label, value, last }) => (
            <div className={`p-4 flex justify-between items-center gap-3 ${last ? '' : 'border-b border-gray-200'}`}>
                <span className="text-[17px] text-black">{label}</span>
                <span className="text-[17px] text-gray-500 text-right">{value}</span>
            </div>
        );

        const DateTile = ({ date, dim, size = 'md' }) => {
            const box = size === 'lg' ? 'w-14 h-14 rounded-[16px]' : 'w-12 h-12 rounded-[14px]';
            return (
                <div className={`${box} shrink-0 flex flex-col items-center justify-center shadow-md ${dim ? DIM_TILE : DAY_GRADIENTS[date.getDay()]}`}>
                    <span className="text-[10px] leading-none opacity-90">{TH_DAYS_SHORT[date.getDay()]}</span>
                    <span className={`${size === 'lg' ? 'text-[22px]' : 'text-[19px]'} font-bold leading-tight tabular-nums`}>{date.getDate()}</span>
                </div>
            );
        };

        // แถบจำนวนคน: mode "cap" = เต็มเมื่อถึงเพดาน, mode "min" = ผ่านเมื่อถึงขั้นต่ำ
        // mode: 'cap' = เต็มเมื่อถึง target | 'min' = ต้องถึง target | 'range' = ขั้นต่ำ min (ขีดบนแถบ) เต็มที่ target
        const CapacityBar = ({ label, count, target, min, mode = 'cap' }) => {
            const pct = Math.min(100, target > 0 ? (count / target) * 100 : 0);
            const reached = count >= target;
            let barColor, textColor = 'text-gray-500';
            if (mode === 'range') {
                barColor = reached ? 'bg-rose-500' : count >= min ? 'bg-[#34C759]' : 'bg-amber-400';
                if (reached) textColor = 'text-rose-600 font-semibold';
            } else {
                barColor = mode === 'cap' ? (reached ? 'bg-rose-500' : 'bg-[#34C759]') : (reached ? 'bg-[#34C759]' : 'bg-amber-400');
                if (mode === 'cap' && reached) textColor = 'text-rose-600 font-semibold';
            }
            return (
                <div className="flex items-center gap-2 text-[12px]">
                    <span className="w-12 text-gray-500 shrink-0">{label}</span>
                    <div className="relative flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all duration-500 ${barColor}`} style={{ width: `${pct}%` }} />
                        {mode === 'range' && min > 0 && min < target && (
                            <div className="absolute top-0 h-full w-[2px] bg-white/90 mix-blend-normal" style={{ left: `calc(${(min / target) * 100}% - 1px)` }} />
                        )}
                    </div>
                    <span className={`w-10 text-right tabular-nums ${textColor}`}>{count}/{target}</span>
                </div>
            );
        };

        const NameChip = ({ name, isMe, picture, size = 'sm' }) => {
            const lg = size === 'lg';
            const dim = lg ? 'w-7 h-7' : 'w-5 h-5';
            return (
                <span className={`${lg ? 'pl-1.5 pr-3 py-1.5 text-[16px]' : 'pl-1 pr-2.5 py-1 text-[13px]'} inline-flex items-center gap-1.5 rounded-full font-medium ${isMe ? 'bg-[#007AFF] text-white' : 'bg-gray-100 text-gray-700'}`}>
                    {picture
                        ? <img src={picture} alt="" referrerPolicy="no-referrer" className={`${dim} rounded-full object-cover shrink-0`} />

        // ===================== หน้าจัดการข้อมูลแอดมิน (ชีท Sessions / Users / Registrations / Settings) =====================

        function AdminPanel({ sessions, users, registrations, limits = {}, sendApiRequest, onChanged, onClose, showToast }) {
            const [tab, setTab] = useState('sessions');
            const [editor, setEditor] = useState(null);      // { kind: 'session' | 'user', data }
            const [busy, setBusy] = useState(false);
            const [query, setQuery] = useState('');

            const call = async (action, payload, okMsg) => {
                setBusy(true);
                try {
                    const r = await sendApiRequest(action, payload);
                    if (r.status === 'success') {
                        showToast(okMsg || r.message || 'บันทึกแล้ว');
                        await onChanged();
                        return true;
                    }
                    showToast(r.message || 'ทำรายการไม่สำเร็จ', 'error');
                    return false;
                } catch (e) {
                    showToast('เชื่อมต่อไม่ได้: ' + e.message, 'error');
                    return false;
                } finally {
                    setBusy(false);
                }
            };

            const nameOf = id => (users.find(u => String(u.User_ID) === String(id)) || {}).DisplayName || 'ไม่ทราบชื่อ';
            const setData = patch => setEditor({ ...editor, data: { ...editor.data, ...patch } });

            // ---------- Sessions ----------
            const sessionList = sessions.filter(s => s.Session_ID)
                .sort((a, b) => parseSessionDate(b.Date) - parseSessionDate(a.Date));

            const newSession = () => setEditor({ kind: 'session', data: { Session_ID: '', date: toInputDate(new Date()), type: 'Workday', location: '', status: 'Open', cost: 200 } });
            const editSession = s => setEditor({ kind: 'session', data: {
                Session_ID: s.Session_ID, date: toInputDate(s.Date), type: s.Type || 'Workday',
                location: s.Location || '', status: s.Status || 'Open', cost: s.Cost === '' ? 0 : s.Cost } });
            const saveSession = async () => {
                const d = editor.data;
                const ok = await call('adminSaveSession', { session_id: d.Session_ID, date: d.date, type: d.type, location: d.location, status: d.status, cost: d.cost });
                if (ok) setEditor(null);
            };
            const deleteSession = async () => {
                const n = registrations.filter(r => String(r.Session_ID) === String(editor.data.Session_ID)).length;
                if (!window.confirm(`ลบรอบ ${editor.data.Session_ID} และรายชื่อ ${n} คนในรอบนี้ถาวร?`)) return;
                const ok = await call('adminDeleteSession', { session_id: editor.data.Session_ID });
                if (ok) setEditor(null);
            };

            // ---------- Users ----------
            const userList = users.filter(u => u.User_ID)
                .filter(u => !query || String(u.DisplayName || '').toLowerCase().includes(query.toLowerCase()))
                .sort((a, b) => String(a.DisplayName || '').localeCompare(String(b.DisplayName || ''), 'th'));
            const newUser = () => setEditor({ kind: 'user', data: { User_ID: '', name: '', skill: 'C', linked: false } });
            const editUser = u => setEditor({ kind: 'user', data: { User_ID: u.User_ID, name: u.DisplayName || '', skill: u.Skill_Level || '', linked: !!u.Linked } });
            const saveUser = async () => {
                const d = editor.data;
                const ok = await call('adminSaveUser', { user_id: d.User_ID, display_name: d.name, skill_level: d.skill });
                if (ok) setEditor(null);
            };
            const unlinkUser = async () => {
                if (!window.confirm('ปลดการผูก LINE ของสมาชิกคนนี้? เขาจะต้องผูกบัญชีใหม่อีกครั้ง')) return;
                const ok = await call('adminUnlinkUser', { user_id: editor.data.User_ID });
                if (ok) setEditor(null);
            };
            const deleteUser = async () => {
                const n = registrations.filter(r => String(r.User_ID) === String(editor.data.User_ID)).length;
                if (!window.confirm(`ลบ "${editor.data.name}" และรายชื่อที่ลงไว้ ${n} รอบถาวร?`)) return;
                const ok = await call('adminDeleteUser', { user_id: editor.data.User_ID });
                if (ok) setEditor(null);
            };

            // ---------- Registrations ----------
            const [regSession, setRegSession] = useState('');
            const [regRows, setRegRows] = useState([]);
            const [regBase, setRegBase] = useState([]);   // snapshot ตอนเลือกรอบ ใช้คำนวณส่วนต่างตอนบันทึก
            const [regAdd, setRegAdd] = useState('');
            const regSessionObj = sessions.find(s => String(s.Session_ID) === String(regSession));
            const isWorkdayReg = !!regSessionObj && regSessionObj.Type === 'Workday';
            useEffect(() => {
                if (tab !== 'regs' || regSession || !sessionList.length) return;
                const today = new Date(); today.setHours(0, 0, 0, 0);
                const next = [...sessionList].reverse().find(s => parseSessionDate(s.Date) >= today) || sessionList[0];
                setRegSession(String(next.Session_ID));
            }, [tab, sessions]);
            // โหลดรายชื่อใหม่เมื่อเปลี่ยนรอบ หรือหลังบันทึกเสร็จ ไม่ทับสิ่งที่แอดมินแก้ค้างไว้ตอนข้อมูลรีเฟรชเอง
            const loadRegs = () => {
                const rows = registrations.filter(r => String(r.Session_ID) === String(regSession)).map(r => ({ ...r }));
                setRegRows(rows);
                setRegBase(rows);
                setRegAdd('');
            };
            const [reloadTick, setReloadTick] = useState(0);
            useEffect(() => { loadRegs(); }, [regSession, reloadTick]);
            const addReg = () => {

            const saveRegs = async () => {
                const d = diffRegs(regBase, regRows);

                                        const saveBtn = changed && (
                                            <button onClick={() => saveSetting(r.Key)} disabled={busy} className="shrink-0 px-4 h-9 rounded-[10px] bg-[#007AFF] text-white text-[15px] font-semibold disabled:opacity-50">บันทึก</button>
                                        );
                                        return (

                                                <div className="flex items-center gap-3">
                                                    <div className="flex-1 min-w-0">
                                                        <div className="text-[16px] text-black leading-snug">{meta.label || r.Description || r.Key}</div>
                                                        <div className="text-[11px] text-gray-400 font-mono truncate">{r.Key}</div>

                                                    {isBool ? (
                                                        <button type="button" role="switch" aria-checked={isOn} onClick={() => edit(isOn ? 'FALSE' : 'TRUE')}
                                                            className={`${isOn ? 'bg-[#34C759]' : 'bg-[#E9E9EA]'} relative inline-flex h-[31px] w-[51px] shrink-0 rounded-full transition-colors duration-300`}>
                                                            <span className={`${isOn ? 'translate-x-[22px]' : 'translate-x-[2px]'} inline-block h-[27px] w-[27px] mt-[2px] rounded-full bg-white shadow transition duration-300`} />
                                                        </button>
                                                    ) : !wide && (
                                                        <div className="flex items-center gap-1.5 shrink-0">
                                                            <input type="number" inputMode="numeric" value={val} onChange={e => edit(e.target.value)}
                                                                min={(limits[r.Key] || {}).min} max={(limits[r.Key] || {}).max}
                                                                className="w-[72px] bg-gray-100 rounded-[10px] px-3 py-2 text-[16px] text-black text-right outline-none tabular-nums" />
                                                            {meta.unit && <span className="text-[14px] text-gray-500 w-8">{meta.unit}</span>}
                                                        </div>
                                                    )}
                                                </div>
                                                {wide && (
                                                    <input value={val} onChange={e => edit(e.target.value)} placeholder={meta.hint || ''} className={`${FIELD} mt-2 font-mono text-[14px]`} />
                                                )}
                                                {meta.warn && <div className="text-[12px] text-[#FF9500] mt-1.5">{meta.warn}</div>}

                    </div>

                    {editor && editor.kind === 'session' && (
                        <AdminSheet title={editor.data.Session_ID ? `แก้ไขรอบ ${editor.data.Session_ID}` : 'เพิ่มรอบตี'} busy={busy}
                            onClose={() => setEditor(null)} onSave={saveSession} onDelete={editor.data.Session_ID ? deleteSession : null}>
                            <AdminField label="วันที่"><input type="date" value={editor.data.date} onChange={e => setData({ date: e.target.value })} className={FIELD} /></AdminField>
                            <AdminField label="ประเภท">
                                <select value={editor.data.type} onChange={e => setData({ type: e.target.value })} className={FIELD}>
                                    <option value="Workday">วันธรรมดา</option><option value="Weekend">วันหยุด</option>

                            <AdminField label="สนาม"><input value={editor.data.location} onChange={e => setData({ location: e.target.value })} className={FIELD} /></AdminField>
                            <AdminField label="สถานะ">
                                <select value={editor.data.status} onChange={e => setData({ status: e.target.value })} className={FIELD}>
                                    <option value="Open">เปิดรับ</option><option value="Closed">ปิดรับ</option><option value="Cancelled">งด</option>
                                </select>
                            </AdminField>
                            <AdminField label="ค่าคอร์ด (บาท)"><input type="number" inputMode="numeric" value={editor.data.cost} onChange={e => setData({ cost: e.target.value })} className={FIELD} /></AdminField>

                    {editor && editor.kind === 'user' && (
                        <AdminSheet title={editor.data.User_ID ? 'แก้ไขสมาชิก' : 'เพิ่มสมาชิก'} busy={busy}
                            onClose={() => setEditor(null)} onSave={saveUser} onDelete={editor.data.User_ID ? deleteUser : null}
                            extra={editor.data.User_ID && editor.data.linked && (
                                <button onClick={unlinkUser} disabled={busy} className="w-full bg-white rounded-[14px] shadow-sm py-3.5 mb-3 text-[17px] text-[#FF9500] active:bg-gray-50 disabled:opacity-50">ปลดการผูก LINE</button>
