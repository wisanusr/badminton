# Publishes ONLY the web page to GitHub Pages (so Code.gs is not served publicly).
# Inactive until you opt in:
#   1. Settings > Secrets and variables > Actions > Variables: add PAGES_VIA_ACTIONS = true
#   2. Settings > Pages > Build and deployment > Source: GitHub Actions
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PAGES_VIA_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect web files
        run: |
          mkdir _site
          cp index.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
