name: Test backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
      - run: node tests/pairing.js
      # the Pages build must keep working (fails if index.html no longer has the parts build.mjs expects)
      - run: npm ci && node scripts/build.mjs
